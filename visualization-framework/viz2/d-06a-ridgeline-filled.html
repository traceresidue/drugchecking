(function(){
/* Compact series navigation — dropdown, prev/next, home link.
   NAV_REGISTRY is inlined at build time from src/registry.json. */

const PREVIEW_FALLBACK = {
  '06a-ridgeline-filled': '06-spectral-ridgeline',

function pageFile(id, mode) {
  return mode === 'lab' ? `d-${id}.html` : `${id}.html`;
}

function previewId(id) {
  return PREVIEW_FALLBACK[id] || id;
}

function previewSrc(id, mode) {
  const base = mode === 'lab' ? '../viz/review-previews' : 'review-previews';
  return `${base}/${previewId(id)}.png`;
}

function injectNavCSS() {
  if (document.getElementById('dcf-nav-css')) return;
  const s = document.createElement('style');
  s.id = 'dcf-nav-css';
  s.textContent = `
  .dcf-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;margin:0 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:0;z-index:30}
  .dcf-nav-home{font:600 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid transparent;transition:color .15s,background .15s,border-color .15s}
  .dcf-nav-home:hover,.dcf-nav-home:focus-visible{color:var(--ink);background:var(--panel2);border-color:var(--line);outline:none}
  .dcf-nav-btn{min-width:40px;min-height:40px;padding:0 12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;font:600 15px/1 var(--font-sans);cursor:pointer;transition:background .15s,color .15s}
  .dcf-nav-btn:hover,.dcf-nav-btn:focus-visible{background:var(--panel);color:var(--ink);outline:none}

  .dcf-nav-select{flex:1 1 180px;min-width:140px;max-width:420px;min-height:40px;padding:8px 32px 8px 12px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:500 13px var(--font-sans);cursor:pointer}
  .dcf-nav-select:hover,.dcf-nav-select:focus-visible{border-color:var(--muted);outline:none}
  .dcf-nav-pos{margin-left:auto;font:500 11px/1 var(--font-mono);color:var(--faint);white-space:nowrap}

  .dcf-index-hero h1{font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .dcf-index-hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:72ch}
  .dcf-index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:18px 0 32px}
  .dcf-index-card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}

  .dcf-index-switch a{font:500 12px var(--font-sans);color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px}

function navLabel(entry) {
  const n = String(entry.n).padStart(2, '0');
  const variant = entry.id.match(/^\d+[a-z]-/);
  const suffix = variant ? ` · ${entry.id.split('-').slice(1).join(' ')}` : '';
  return `Nº ${n} · ${entry.title}${suffix}`;
}

function injectNav({ pageId, mode = 'viz' } = {}) {
  if (!pageId || document.querySelector('.dcf-nav')) return;
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  if (!items.length) return;

  const idx = items.findIndex(e => e.id === pageId);
  const cur = idx >= 0 ? idx : 0;
  const prev = items[(cur - 1 + items.length) % items.length];
  const next = items[(cur + 1) % items.length];

  const nav = document.createElement('nav');
  nav.className = 'dcf-nav';
  nav.setAttribute('aria-label', 'Visualization series navigation');

  const home = document.createElement('a');
  home.className = 'dcf-nav-home';
  home.href = 'index.html';
  home.textContent = mode === 'lab' ? 'Design Lab' : 'All viz';

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.className = 'dcf-nav-btn';
  prevBtn.setAttribute('aria-label', `Previous: ${prev.title}`);
  prevBtn.textContent = '←';
  prevBtn.onclick = () => { location.href = pageFile(prev.id, mode); };

  const sel = document.createElement('select');
  sel.className = 'dcf-nav-select';
  sel.setAttribute('aria-label', 'Jump to visualization');
  items.forEach(entry => {
    const opt = document.createElement('option');
    opt.value = pageFile(entry.id, mode);
    opt.textContent = navLabel(entry);
    if (entry.id === pageId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { if (sel.value) location.href = sel.value; };

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'dcf-nav-btn';
  nextBtn.setAttribute('aria-label', `Next: ${next.title}`);
  nextBtn.textContent = '→';
  nextBtn.onclick = () => { location.href = pageFile(next.id, mode); };

  const pos = document.createElement('span');
  pos.className = 'dcf-nav-pos';
  pos.textContent = `${cur + 1} / ${items.length}`;

  nav.append(home, prevBtn, sel, nextBtn, pos);

  const hdr = document.querySelector('.dcf-h');
  if (hdr) document.body.insertBefore(nav, hdr);
  else document.body.prepend(nav);
}

function buildIndexPage({ mode = 'viz', title, dek, switchHref } = {}) {
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  const prodHref = mode === 'lab' ? '../viz/index.html' : 'index.html';
  const labHref = mode === 'lab' ? 'index.html' : (switchHref || '../viz2/index.html');
  const hero = document.createElement('header');
  hero.className = 'dcf-index-hero';
  hero.innerHTML = `
    <h1>${title || 'Drug Checking Visualizations'}</h1>
    <p>${dek || ''}</p>
    <div class="dcf-index-switch">
      <a href="${prodHref}" aria-current="${mode === 'viz' ? 'page' : 'false'}">Production viz</a>
      <a href="${labHref}" aria-current="${mode === 'lab' ? 'page' : 'false'}">Design Lab</a>
    </div>`;

  const grid = document.createElement('div');
  grid.className = 'dcf-index-grid';
  grid.setAttribute('role', 'list');

  items.forEach(entry => {
    const card = document.createElement('a');
    card.className = 'dcf-index-card';
    card.href = pageFile(entry.id, mode);
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', `${entry.title} — ${entry.cat}`);

    const thumb = document.createElement('div');
    thumb.className = 'dcf-index-thumb';
    const img = document.createElement('img');
    img.src = previewSrc(entry.id, mode);
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => {
      img.remove();
      const fb = document.createElement('div');
      fb.className = 'dcf-index-thumb-fallback';
      fb.textContent = entry.cat;
      thumb.appendChild(fb);
    };
    thumb.appendChild(img);

    const body = document.createElement('div');
    body.className = 'dcf-index-body';
    body.innerHTML = `
      <div class="dcf-index-meta">Nº ${String(entry.n).padStart(2, '0')} · ${entry.cat}</div>
      <h2 class="dcf-index-title">${entry.title}</h2>
      <p class="dcf-index-cat">${entry.id.replace(/-/g, ' ')}</p>`;

    card.append(thumb, body);
    grid.appendChild(card);
  });

  document.body.append(hero, grid);
}


window.DCF_NAV={injectNav,buildIndexPage,pageFile,previewSrc};

})();
</script>
<script>
(function(){
/* Drug Checking Visualization Framework — shared helpers
   Loaded by every standalone visualization. Pure ES module, no dependencies.
   Provides: design tokens (CSS injection), substance classification + palette,
   spectral synthesis (Gaussian chromatograms, stick spectra, FTIR curves),
   formatting, tooltip, and a small DOM scaffold builder. */

const TOKENS = {
  bg:'#0b0e14', panel:'#121826', panel2:'#1a2234', line:'#26304a',
  ink:'#e8ecf4', muted:'#8b94a8', faint:'#5b6478',
  opioid:'#ff8a5c', fent:'#ff5c7a', xyl:'#b388ff', stim:'#ffd166',
  coke:'#4cc9f0', benzo:'#7aa2ff', cut:'#6ee7a8', other:'#94a3b8',
  alert:'#ff5c7a', watch:'#ffd166', ok:'#6ee7a8', info:'#4cc9f0'
};

/* Sans-only UI prose + mono instrument readouts — always terminate with generic family. */
const FONTS = {
  sans:'Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
  mono:'"Cascadia Mono", ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace',
};

/* Map a substance name -> {class, color, label, action} */
const CLASS = {
  fent:{color:TOKENS.fent,label:'Fentanyl & analogs'},
  opioid:{color:TOKENS.opioid,label:'Opioid'},
  xyl:{color:TOKENS.xyl,label:'Sedative / xylazine'},
  stim:{color:TOKENS.stim,label:'Stimulant'},
  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
/* Broad families for filters and labels — cls stays fine-grained for chart colors. */
const FAMILY_MAP = {
  fent:'opioid', opioid:'opioid',
  stim:'stim', coke:'stim',
  xyl:'xyl', benzo:'benzo', cut:'cut', other:'other',
};
const FAMILY_LABEL = {
  opioid:'Opioid',
  stim:'Stimulant',
  xyl:'Sedative / xylazine',
  benzo:'Benzodiazepine',
  cut:'Cut / diluent',
  other:'Other',
};
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES){
    if(re.test(n)){
      const family = FAMILY_MAP[c] || c;
      return {cls:c,color:CLASS[c].color,label:CLASS[c].label,family,familyLabel:FAMILY_LABEL[family]||FAMILY_LABEL.other};
    }
  }
  return {cls:'other',...CLASS.other,family:'other',familyLabel:FAMILY_LABEL.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

  const layout = {
    paper_bgcolor: chrome.bg,

    colorway: SUBSTANCE_KEYS.map(k => getClassColor(k)),
    ...base
  };
  if (layout.xaxis) layout.xaxis = { ...layout.xaxis, showticklabels: showAxis, color: chrome.muted };
  else layout.xaxis = { showticklabels: showAxis, color: chrome.muted };
  if (layout.yaxis) layout.yaxis = { ...layout.yaxis, showticklabels: showAxis, color: chrome.muted };
  else layout.yaxis = { showticklabels: showAxis, color: chrome.muted };
  if (layout.scene) {
    layout.scene = {
      ...layout.scene,
      bgcolor: chrome.bg,
      xaxis: { ...(layout.scene.xaxis || {}), color: chrome.muted, showticklabels: showAxis },

      zaxis: { ...(layout.scene.zaxis || {}), color: chrome.muted, showticklabels: showAxis }

  }
  if (layout.legend) layout.legend = { ...layout.legend, visible: showLegend };

<script>

const {chromatogram,classify,TOKENS}=DCF;

/* Shared batch-ridgeline synthesis + per-drug variability columns (06a/b/c). */
const SAMPLE_COUNT=50;
const RT=Object.fromEntries(DATA.retention_times.map(d=>[d.substance,d.rt]));

const DRUGS_BY_CLASS={
  opioid:['fentanyl','4-anpp','heroin','p-fluorofentanyl'],
  stimulant:['methamphetamine','cocaine','caffeine'],
  cut:['acetaminophen','caffeine','lidocaine','diphenhydramine']
};
const ALL_TRACKED=[...new Set(Object.values(DRUGS_BY_CLASS).flat())];

const SHORT={
  fentanyl:'fentanyl','4-anpp':'4-ANPP',heroin:'heroin','p-fluorofentanyl':'p-FF',
  methamphetamine:'meth',cocaine:'cocaine',caffeine:'caffeine',
  acetaminophen:'APAP',lidocaine:'lidocaine',diphenhydramine:'DPH',
  xylazine:'xylazine',bromazolam:'bromazolam'
};
function shortName(s){return SHORT[s]||s.replace(/ .*/,'').slice(0,12);}
function drugHue(s){return classify(s).color;}

const PALETTE={
  stable:{
    core:['fentanyl','4-anpp','xylazine'],
    variable:['acetaminophen','caffeine','lidocaine'],
    rtSigma:0.045,ampSigma:0.14,drop:0.07,emerge:null
  },
  volatile:{
    core:['fentanyl','4-anpp'],
    variable:['acetaminophen','caffeine','lidocaine','diphenhydramine'],
    rtSigma:0.2,ampSigma:0.48,drop:0.24,emerge:'bromazolam'
  }
};
const EXTRA_RT={bromazolam:11.4,lidocaine:7.26,xylazine:7.67,'p-fluorofentanyl':10.84,heroin:10.12,methamphetamine:4.11,cocaine:8.39,diphenhydramine:7.1};

const KEY_SUBSTANCES=[
  {id:'fentanyl',substance:'fentanyl',label:'Fentanyl',classFilter:'opioid'},
  {id:'heroin',substance:'heroin',label:'Heroin',classFilter:'opioid'},
  {id:'meth',substance:'methamphetamine',label:'Meth',classFilter:'stimulant'},
  {id:'cocaine',substance:'cocaine',label:'Cocaine',classFilter:'stimulant'}
];
function keySubstanceMeta(id){return KEY_SUBSTANCES.find(k=>k.id===id)||KEY_SUBSTANCES[0];}
function keySubstanceControlsMarkup(defaultId='fentanyl'){
  const sep='<span style="width:1px;height:24px;background:var(--line);margin:0 4px"></span>';
  const btns=KEY_SUBSTANCES.map(k=>`<button class="tgl" id="k-${k.id}" aria-pressed="${k.id===defaultId}">${k.label}</button>`).join('');
  return sep+btns;

function initKeySubstanceControls(defaultId,redraw){
  let active=defaultId;
  KEY_SUBSTANCES.forEach(k=>{
    const el=document.getElementById('k-'+k.id);
    if(!el)return;
    el.setAttribute('aria-pressed',k.id===active);
    el.onclick=()=>{
      active=k.id;
      KEY_SUBSTANCES.forEach(x=>document.getElementById('k-'+x.id).setAttribute('aria-pressed',x.id===active));
      redraw();
    };
  });
  return ()=>keySubstanceMeta(active);
}
function domainForSubstance(rows,substance){
  const st=computeDrugStats(rows,substance);
  const half=Math.max(0.28,st.stdRt*3.5,0.22);
  return [Math.max(2,st.meanRt-half),Math.min(14,st.meanRt+half)];
}
function peaksForKeySubstance(peaks,substance){
  return peaks.filter(p=>p.s===substance);
}
function rowIndexForSampleNum(rows,sampleNum){
  return Math.max(0,Math.min(rows.length-1,rows.length-sampleNum));
}
function sampleNumForRowIndex(rows,rowIdx){
  return rows.length-rowIdx;
}

function drawFocusChromatogram(container,rows,sampleNum,keyId,domain){
  const svg=d3.select(container);
  svg.selectAll('*').remove();
  const node=svg.node();
  if(!node)return;
  const W=node.clientWidth||640,H=+svg.attr('height')||112;
  const m={t:12,r:16,b:22,l:54};
  const rowIdx=rowIndexForSampleNum(rows,sampleNum);
  const peaks=rows[rowIdx]||[];
  const meta=keySubstanceMeta(keyId);
  const sub=meta.substance;
  const x0=domain?domain[0]:3,x1=domain?domain[1]:13;
  const x=d3.scaleLinear([x0,x1],[m.l,W-m.r]);
  const y=d3.scaleLinear([0,100],[H-m.b,m.t]);
  const trace=chromatogram(peaks,{x0,x1,sigma:0.05,n:180});
  const hue=drugHue(sub);
  const kp=peaks.find(p=>p.s===sub);
  const st=computeDrugStats(rows,sub);

  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',H-m.t-m.b)
    .attr('fill',TOKENS.panel2).attr('stroke',TOKENS.line).attr('rx',4);
  if(trace.y.length){
    const area=d3.area().x((d,k)=>x(trace.x[k])).y0(H-m.b).y1(d=>y(d)).curve(d3.curveBasis);
    svg.append('path').datum(trace.y).attr('d',area).attr('fill',hue).attr('opacity',kp?0.14:0.04);
    svg.append('path').datum(trace.y)
      .attr('d',d3.line().x((d,k)=>x(trace.x[k])).y(d=>y(d)).curve(d3.curveBasis))
      .attr('fill','none').attr('stroke',TOKENS.ink).attr('stroke-width',1.2).attr('opacity',0.75);
  }
  svg.append('line').attr('x1',x(st.meanRt)).attr('x2',x(st.meanRt)).attr('y1',m.t).attr('y2',H-m.b)
    .attr('stroke',hue).attr('stroke-width',1.5).attr('opacity',0.55).attr('stroke-dasharray','4,3');
  if(kp){
    svg.append('circle').attr('cx',x(kp.rt)).attr('cy',y(100)).attr('r',4)
      .attr('fill',devColor(hue,normDev(kp,st))).attr('stroke',TOKENS.bg).attr('stroke-width',0.8);
  }
  svg.append('text').attr('x',m.l+6).attr('y',m.t+11).attr('fill',TOKENS.muted).attr('font-size',10)
    .text(`Sample #${sampleNum} · ${meta.label}${kp?' · RT '+kp.rt.toFixed(2):' · absent'}`);
  svg.append('text').attr('x',W/2).attr('y',H-4).attr('text-anchor','middle').attr('fill',TOKENS.faint).attr('font-size',10)
    .text('retention time (min)');
}

function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function baseRt(s){return RT[s]||EXTRA_RT[s]||8;}

function sampleRows(mode,opts={}){
  const cfg=PALETTE[mode];
  const r=rng(mode==='stable'?7:42);
  const rows=[];
  if(opts.classFilter){
    const drugs=DRUGS_BY_CLASS[opts.classFilter];
    for(let i=0;i<SAMPLE_COUNT;i++){
      const age=i/SAMPLE_COUNT;
      const peaks=[];
      drugs.forEach((s,di)=>{
        const isCore=di<2;
        const drop=isCore?cfg.drop*0.35:cfg.drop*1.1;
        if(r()>drop){
          const rtW=isCore?cfg.rtSigma*0.75:cfg.rtSigma*(mode==='volatile'?1.4:1);
          peaks.push({
            s,
            rt:baseRt(s)+(r()-0.5)*rtW,
            amp:(30+r()*60)*(1+(r()-0.5)*cfg.ampSigma)*(isCore?1.1:0.85),
            sigma:0.05
          });
        }
      });
      if(mode==='volatile' && opts.classFilter==='opioid' && age>0.4 && r()<0.35){
        const s='p-fluorofentanyl';
        if(!peaks.some(p=>p.s===s)) peaks.push({s,rt:baseRt(s)+(r()-0.5)*cfg.rtSigma*1.6,amp:18+r()*40,sigma:0.05});
      }
      rows.push(peaks);
    }
    return rows;
  }
  const pool=[...cfg.core,...cfg.variable,...(cfg.emerge?[cfg.emerge]:[]),'xylazine','heroin','p-fluorofentanyl','methamphetamine','cocaine','diphenhydramine'];
  for(let i=0;i<SAMPLE_COUNT;i++){
    const age=i/SAMPLE_COUNT;
    const peaks=[];
    const add=(s,opts2={})=>{
      const isCore=cfg.core.includes(s);
      const drop=isCore?cfg.drop*0.4:cfg.drop;
      if(r()>drop){
        const rtW=opts2.rtWide?cfg.rtSigma*1.8:cfg.rtSigma;
        peaks.push({
          s,
          rt:baseRt(s)+(r()-0.5)*rtW*(isCore?0.7:1),
          amp:(opts2.amp||35+r()*55)*(s==='fentanyl'?1.15:0.85)*(1+(r()-0.5)*cfg.ampSigma),
          sigma:0.05
        });
      }
    };
    cfg.core.forEach(s=>add(s));
    cfg.variable.forEach(s=>{ if(r()>0.18) add(s); });
    if(cfg.emerge && age>0.32 && r()<(age-0.25)*1.1) add(cfg.emerge,{rtWide:true,amp:22});
    if(r()<0.28) add('heroin');
    if(r()<0.22) add('p-fluorofentanyl');
    if(r()<0.18) add('methamphetamine',{rtWide:true});
    if(r()<0.14) add('cocaine');
    rows.push(peaks);
  }
  return rows;
}

function hexRgb(hex){
  const h=hex.replace('#','');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function rgbHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0,s=0,l=(mx+mn)/2;
  if(d){
    s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r) h=((g-b)/d+(g<b?6:0))/6;
    else if(mx===g) h=((b-r)/d+2)/6;
    else h=((r-g)/d+4)/6;
  }
  return [h*360,s,l];
}
function hslCss(h,s,l){return `hsl(${((h%360)+360)%360},${(s*100).toFixed(0)}%,${(l*100).toFixed(0)}%)`;}
function devColor(baseHex,t){
  const [r,g,b]=hexRgb(baseHex);
  let [h,s,l]=rgbHsl(r,g,b);
  const spread=Math.min(1,Math.max(0,t));
  h+=spread*52*(spread>0.5?1:-1);
  s=Math.min(0.95,s+spread*0.28);
  l=Math.max(0.22,Math.min(0.78,l+(spread-0.45)*0.18));
  return hslCss(h,s,l);
}

function computeDrugStats(rows,substance){
  const hits=rows.map(peaks=>peaks.find(p=>p.s===substance)).filter(Boolean);
  const rts=hits.map(p=>p.rt), amps=hits.map(p=>p.amp);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:baseRt(substance);
  const std=(a,mu)=>a.length?Math.sqrt(a.reduce((s,v)=>s+(v-mu)**2,0)/a.length):0;
  const meanRt=mean(rts), meanAmp=mean(amps)||50;
  return {
    substance, meanRt, meanAmp,
    stdRt:Math.max(std(rts,meanRt),0.025),
    stdAmp:Math.max(std(amps,meanAmp),4),
    presence:hits.length/rows.length,
    hits
  };
}

function normDev(peak,stats){
  if(!peak) return 1;
  const rtD=Math.abs(peak.rt-stats.meanRt)/Math.max(stats.stdRt*2.2,0.04);
  const ampD=Math.abs(peak.amp-stats.meanAmp)/Math.max(stats.stdAmp*2.2,8);
  return Math.min(1,(rtD*0.55+ampD*0.45)/2.2);
}

function activeDrugs(rows,classFilter){
  const pool=classFilter?DRUGS_BY_CLASS[classFilter]:ALL_TRACKED;
  return pool.filter(s=>rows.some(peaks=>peaks.some(p=>p.s===s))||pool.indexOf(s)<4);
}

function idealPeaks(drugs,rows){
  return drugs.map(s=>{
    const st=computeDrugStats(rows,s);
    return {s,rt:st.meanRt,amp:st.meanAmp,sigma:0.04};
  });
}

function layout(H,refH=38){
  const labelH=72,refGap=10;
  return {
    t:16,r:18,b:labelH,l:52,
    refH,refGap,
    refTop:H-labelH-refGap-refH,
    refBottom:H-labelH-refGap
  };
}

function sampleBand(H,m){return H-m.t-m.b-m.refH-m.refGap;}

function ySample(i,m,H,rows){
  return m.t+(i+1)*(sampleBand(H,m)/rows.length);
}
function rowPitch(H,m,rows){return sampleBand(H,m)/rows.length;}

function rowYScale(i,m,H,rows,overlap){
  const baseY=ySample(i,m,H,rows);
  return d3.scaleLinear([0,100],[baseY,baseY-overlap*rowPitch(H,m,rows)]);
}

function substancePeakOnRow(peaks,sub,x,yScale,domain,peakFilter){
  const p=peaks.find(pk=>pk.s===sub);
  if(!p)return null;
  const rowPeaks=peakFilter?peakFilter(peaks):peaks;
  if(!rowPeaks.some(rp=>rp.s===sub))return null;
  const trace=chromatogram(rowPeaks,{x0:domain[0],x1:domain[1],sigma:0.05,n:140});
  const halfWin=Math.max(0.08,(domain[1]-domain[0])*0.04);
  let maxV=-1,maxI=0;
  trace.x.forEach((t,k)=>{
    if(Math.abs(t-p.rt)<=halfWin&&trace.y[k]>maxV){maxV=trace.y[k];maxI=k;}
  });
  if(maxV<0){
    maxI=trace.x.reduce((best,t,k)=>Math.abs(t-p.rt)<Math.abs(trace.x[best]-p.rt)?k:best,0);
  }
  return {x:x(trace.x[maxI]),y:yScale(trace.y[maxI])};
}

function drawReferenceRow(svg,x,drugs,rows,x0,x1,m){
  const ideal=idealPeaks(drugs,rows);
  const yScale=d3.scaleLinear([0,100],[m.refBottom,m.refTop]);
  const g=svg.append('g').attr('class','ref-row');
  g.append('text').attr('x',x(x0)-8).attr('y',yScale(52)+4).attr('text-anchor','end')
    .attr('fill',TOKENS.muted).attr('font-size',9).attr('font-family','ui-monospace').text('ideal');
  ideal.forEach(p=>{
    const trace=chromatogram([p],{x0,x1,sigma:0.032,n:160});
    g.append('path').datum(trace.y)
      .attr('d',d3.line().x((d,k)=>x(trace.x[k])).y(d=>yScale(d)).curve(d3.curveBasis))
      .attr('fill','none').attr('stroke',drugHue(p.s)).attr('stroke-width',1.7).attr('opacity',0.88);
    g.append('circle').attr('cx',x(p.rt)).attr('cy',yScale(100)).attr('r',3)
      .attr('fill',drugHue(p.s)).attr('stroke',TOKENS.bg).attr('stroke-width',0.6);
  });
  g.append('line').attr('x1',x(x0)).attr('x2',x(x1)).attr('y1',yScale(0)).attr('y2',yScale(0))
    .attr('stroke',TOKENS.line).attr('stroke-dasharray','3,3').attr('opacity',0.5);
}

function drawVariabilityColumns(svg,{rows,drugs,x,m,H,domain,overlap,peakFilter}){
  const pitch=rowPitch(H,m,rows);
  const topY=ySample(0,m,H,rows)-pitch*0.15;
  const bottomY=ySample(rows.length-1,m,H,rows)+pitch*0.15;
  const pathLine=d3.line()
    .x(d=>d.x)
    .y(d=>d.y)
    .curve(d3.curveCatmullRom.alpha(0.62));

  drugs.forEach(sub=>{
    const stats=computeDrugStats(rows,sub);
    const hue=drugHue(sub);
    const cx=x(stats.meanRt);
    const g=svg.append('g').attr('class','var-col').attr('data-drug',sub);

    const pts=rows.map((peaks,i)=>{
      const baseY=ySample(i,m,H,rows);
      const yScale=rowYScale(i,m,H,rows,overlap);
      const apex=substancePeakOnRow(peaks,sub,x,yScale,domain,peakFilter);
      return apex||{x:cx,y:baseY};
    });

    g.append('line')
      .attr('class','var-col-axis')
      .attr('x1',cx).attr('x2',cx)
      .attr('y1',topY).attr('y2',bottomY)
      .attr('stroke',hue).attr('stroke-width',1).attr('opacity',0.32);

    g.append('path')
      .attr('class','var-path')
      .attr('d',pathLine(pts))
      .attr('fill','none')
      .attr('stroke',hue)
      .attr('stroke-width',2.4)
      .attr('stroke-linecap','round')
      .attr('stroke-linejoin','round')
      .attr('opacity',0.82);

    rows.forEach((peaks,i)=>{
      const p=peaks.find(pk=>pk.s===sub);
      const y=ySample(i,m,H,rows);
      const dev=p?normDev(p,stats):1;
      const col=devColor(hue,dev);

      g.append('circle')
        .attr('class','var-ideal-dot')
        .attr('cx',cx).attr('cy',y)
        .attr('r',p?2.4:1.8)
        .attr('fill',p?col:TOKENS.faint)
        .attr('stroke',TOKENS.bg)
        .attr('stroke-width',0.6)
        .attr('opacity',p?0.92:0.38);
    });
  });
}

function drawDrugLabels(svg,drugs,rows,x,H,m){
  drugs.forEach(sub=>{
    const st=computeDrugStats(rows,sub);
    const cx=x(st.meanRt);
    const hue=drugHue(sub);
    svg.append('line').attr('x1',cx).attr('x2',cx).attr('y1',H-m.b).attr('y2',H-m.b+6)
      .attr('stroke',hue).attr('stroke-width',1.5).attr('opacity',0.85);
    svg.append('text').attr('x',cx).attr('y',H-m.b+18).attr('text-anchor','middle')
      .attr('fill',hue).attr('font-size',10).attr('font-weight',600).text(shortName(sub));
    svg.append('text').attr('x',cx).attr('y',H-m.b+30).attr('text-anchor','middle')
      .attr('fill',TOKENS.faint).attr('font-size',9).attr('font-family','ui-monospace')
      .text(st.meanRt.toFixed(2));
  });
  svg.append('text').attr('x',(x.range()[0]+x.range()[1])/2).attr('y',H-6)
    .attr('text-anchor','middle').attr('fill',TOKENS.muted).attr('font-size',11)
    .text(drugs.length===1
      ? `${shortName(drugs[0])} · retention time (min) — read down the column for batch drift`
      : 'retention time (min) — read down each drug column for batch variation');
}

function drawSampleIndex(svg,m,H,rows){
  svg.append('text').attr('x',m.l-8).attr('y',m.t+8).attr('text-anchor','end')
    .attr('fill',TOKENS.muted).attr('font-size',9).text('newest');
  const step=Math.max(1,Math.floor(rows.length/8));
  for(let i=0;i<rows.length;i+=step){
    const y=ySample(i,m,H,rows);
    svg.append('text').attr('x',m.l-8).attr('y',y+3).attr('text-anchor','end')
      .attr('fill',TOKENS.faint).attr('font-size',8).attr('font-family','ui-monospace')
      .text('#'+(rows.length-i));
  }
}


const CLASS_ORDER=['cut','stim','coke','opioid','fent','xyl','benzo','other'];
const CLASS_SAMPLE={fent:'fentanyl',opioid:'heroin',xyl:'xylazine',stim:'methamphetamine',coke:'cocaine',benzo:'bromazolam',cut:'acetaminophen',other:'ketamine'};
function classColor(cls){return subColor(CLASS_SAMPLE[cls]||'ketamine');}

const stage=scaffold({
  tag:'Nº 06a · GC–MS',
  title:'Batch Ridgeline — Class Fills',
  dek:'Fifty samples split into class-colored fills — pick a key substance to track its column and ideal reference without cross-talk from unrelated peaks.',
  how:`Each row is one of <b>50 newest samples</b>, decomposed into <b>class-filled bands</b> under a thin total outline. Choose a <b>key substance</b> (fentanyl, heroin, meth, cocaine) to zoom the view and trace only that drug's variability column. Below the stack, the <b>ideal reference</b> shows the mean curve for that substance. <b>Limits:</b> band height is within-sample relative signal.`,
  provenance:'Each row synthesized from a plausible component mix over real retention times; illustrative of batch-consistency analysis.',
  harm:'Even a "consistent" supply shifts without warning. Test every time; potency can change while the fingerprint looks the same.'
});

stage.innerHTML=`
<div class="controls">
  <button class="tgl" id="m1" aria-pressed="true">Stable fentanyl market</button>
  <button class="tgl" id="m2" aria-pressed="false">Volatile transition period</button>
  ${keySubstanceControlsMarkup('fentanyl')}
</div>
<div class="panel">
  <svg id="svg" width="100%" height="760" role="img" aria-label="Fifty-sample ridgelines with class fills and key-substance variability column"></svg>
  <div class="legend" id="leg"></div>
</div>`;

let mode='stable';
document.getElementById('m1').onclick=()=>set('stable');
document.getElementById('m2').onclick=()=>set('volatile');
function set(m){mode=m;document.getElementById('m1').setAttribute('aria-pressed',m==='stable');document.getElementById('m2').setAttribute('aria-pressed',m==='volatile');draw();}
const getKeySub=initKeySubstanceControls('fentanyl',draw);

function tracesByClass(peaks){
  const groups={};
  peaks.forEach(p=>{const cls=classify(p.s).cls;if(!groups[cls])groups[cls]=[];groups[cls].push(p);});
  return CLASS_ORDER.filter(c=>groups[c]).map(c=>({cls:c,trace:chromatogram(groups[c],{x0:3,x1:13,sigma:0.05,n:140})}));
}

function draw(){
  const svg=d3.select('#svg'); svg.selectAll('*').remove();
  const W=svg.node().clientWidth,H=760;
  const m=layout(H);
  const keyMeta=getKeySub();
  const rows=sampleRows(mode,{classFilter:keyMeta.classFilter});
  const drugs=[keyMeta.substance];
  const domain=domainForSubstance(rows,keyMeta.substance);
  const x=d3.scaleLinear(domain,[m.l,W-m.r]);
  const overlap=1.55;
  const band=sampleBand(H,m);

  x.ticks(8).forEach(t=>{
    svg.append('line').attr('x1',x(t)).attr('x2',x(t)).attr('y1',m.t).attr('y2',m.t+band).attr('stroke',TOKENS.line).attr('opacity',.22);
  });

  rows.forEach((peaks,i)=>{
    const baseY=ySample(i,m,H,rows);
    const y=rowYScale(i,m,H,rows,overlap);
    const layers=tracesByClass(peaks);
    const total=chromatogram(peaks,{x0:domain[0],x1:domain[1],sigma:0.05,n:140});
    layers.forEach(({cls,trace})=>{
      const area=d3.area().x((d,k)=>x(trace.x[k])).y0(baseY).y1(d=>y(d)).curve(d3.curveBasis);
      svg.append('path').datum(trace.y).attr('d',area).attr('fill',classColor(cls)).attr('opacity',.38);
    });
    svg.append('path').datum(total.y)
      .attr('d',d3.line().x((d,k)=>x(total.x[k])).y(d=>y(d)).curve(d3.curveBasis))
      .attr('fill','none').attr('stroke',TOKENS.ink).attr('stroke-width',0.65).attr('opacity',.45);
  });

  drawVariabilityColumns(svg,{rows,drugs,x,m,H,domain,overlap});
  drawReferenceRow(svg,x,drugs,rows,domain[0],domain[1],m);

  drawDrugLabels(svg,drugs,rows,x,H,m);
  drawSampleIndex(svg,m,H,rows);
  document.getElementById('leg').innerHTML=
    `<span><i style="background:${drugHue(keyMeta.substance)}"></i><b>${keyMeta.label}</b> column active</span>`+
    CLASS_ORDER.map(c=>`<span><i style="background:${classColor(c)}"></i>${classify(CLASS_SAMPLE[c]).label}</span>`).join('');
}
window.__vizRedraw=draw;
draw();
addEventListener('resize',draw);

</script>
