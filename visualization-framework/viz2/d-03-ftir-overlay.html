nt-network","n":17,"cat":"SUPPLY","title":"Adulterant Force Network"},{"id":"17a-adulterant-pull","n":17,"cat":"SUPPLY","title":"Adulterant Pull Network"},{"id":"17b-adulterant-3d","n":17,"cat":"SUPPLY","title":"Adulterant Network (3D)"},{"id":"17c-adulterant-orbit","n":17,"cat":"SUPPLY","title":"Adulterant Orbit Graph"},{"id":"18-result-card","n":18,"cat":"RESULT","title":"Sample Result Card"},{"id":"19-expected-reality-gap","n":19,"cat":"RESULT","title":"Expected-Reality Gap"},{"id":"20-potency-uncertainty","n":20,"cat":"RESULT","title":"Potency Uncertainty Gauge"},{"id":"21-geo-tilegrid","n":21,"cat":"GEO","title":"Supply Tile-Grid Cartogram"},{"id":"22-xylazine-spread","n":22,"cat":"GEO","title":"Xylazine Spread Timeline"},{"id":"23-structure-flipbook","n":23,"cat":"MS","title":"Structure Flipbook"},{"id":"24-anatomy-scrolly","n":24,"cat":"RESULT","title":"Anatomy of a Sample (Scrollytelling)"},{"id":"25-glyph-garden","n":25,"cat":"EXPERIMENTAL","title":"Sample Glyph Garden"}];
const NAV_PAGE_ID = "03-ftir-overlay";
const NAV_MODE = "lab";
(function(){
/* Compact series navigation — dropdown, prev/next, home link.
   NAV_REGISTRY is inlined at build time from src/registry.json. */

const PREVIEW_FALLBACK = {
  '06a-ridgeline-filled': '06-spectral-ridgeline',
  '06b-ridgeline-3d': '06-spectral-ridgeline',

function pageFile(id, mode) {
  return mode === 'lab' ? `d-${id}.html` : `${id}.html`;
}

function previewId(id) {
  return PREVIEW_FALLBACK[id] || id;
}

function previewSrc(id, mode) {
  const base = mode === 'lab' ? '../viz/review-previews' : 'review-previews';
  return `${base}/${previewId(id)}.png`;
}

function injectNavCSS() {
  if (document.getElementById('dcf-nav-css')) return;
  const s = document.createElement('style');
  s.id = 'dcf-nav-css';
  s.textContent = `
  .dcf-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;margin:0 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:0;z-index:30}
  .dcf-nav-home{font:600 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid transparent;transition:color .15s,background .15s,border-color .15s}
  .dcf-nav-home:hover,.dcf-nav-home:focus-visible{color:var(--ink);background:var(--panel2);border-color:var(--line);outline:none}
  .dcf-nav-btn{min-width:40px;min-height:40px;padding:0 12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;font:600 15px/1 var(--font-sans);cursor:pointer;transition:background .15s,color .15s}

function navLabel(entry) {
  const n = String(entry.n).padStart(2, '0');
  const variant = entry.id.match(/^\d+[a-z]-/);
  const suffix = variant ? ` · ${entry.id.split('-').slice(1).join(' ')}` : '';
  return `Nº ${n} · ${entry.title}${suffix}`;
}

function injectNav({ pageId, mode = 'viz' } = {}) {
  if (!pageId || document.querySelector('.dcf-nav')) return;
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  if (!items.length) return;

  const idx = items.findIndex(e => e.id === pageId);
  const cur = idx >= 0 ? idx : 0;
  const prev = items[(cur - 1 + items.length) % items.length];
  const next = items[(cur + 1) % items.length];

  const nav = document.createElement('nav');
  nav.className = 'dcf-nav';
  nav.setAttribute('aria-label', 'Visualization series navigation');

  const home = document.createElement('a');
  home.className = 'dcf-nav-home';
  home.href = 'index.html';
  home.textContent = mode === 'lab' ? 'Design Lab' : 'All viz';

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.className = 'dcf-nav-btn';
  prevBtn.setAttribute('aria-label', `Previous: ${prev.title}`);
  prevBtn.textContent = '←';
  prevBtn.onclick = () => { location.href = pageFile(prev.id, mode); };

  const sel = document.createElement('select');
  sel.className = 'dcf-nav-select';
  sel.setAttribute('aria-label', 'Jump to visualization');
  items.forEach(entry => {
    const opt = document.createElement('option');
    opt.value = pageFile(entry.id, mode);
    opt.textContent = navLabel(entry);
    if (entry.id === pageId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { if (sel.value) location.href = sel.value; };

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'dcf-nav-btn';
  nextBtn.setAttribute('aria-label', `Next: ${next.title}`);
  nextBtn.textContent = '→';
  nextBtn.onclick = () => { location.href = pageFile(next.id, mode); };

  const pos = document.createElement('span');
  pos.className = 'dcf-nav-pos';
  pos.textContent = `${cur + 1} / ${items.length}`;

  nav.append(home, prevBtn, sel, nextBtn, pos);

  const hdr = document.querySelector('.dcf-h');
  if (hdr) document.body.insertBefore(nav, hdr);
  else document.body.prepend(nav);
}

function buildIndexPage({ mode = 'viz', title, dek, switchHref } = {}) {
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  const prodHref = mode === 'lab' ? '../viz/index.html' : 'index.html';
  const labHref = mode === 'lab' ? 'index.html' : (switchHref || '../viz2/index.html');
  const hero = document.createElement('header');
  hero.className = 'dcf-index-hero';
  hero.innerHTML = `
    <h1>${title || 'Drug Checking Visualizations'}</h1>
    <p>${dek || ''}</p>
    <div class="dcf-index-switch">
      <a href="${prodHref}" aria-current="${mode === 'viz' ? 'page' : 'false'}">Production viz</a>
      <a href="${labHref}" aria-current="${mode === 'lab' ? 'page' : 'false'}">Design Lab</a>
    </div>`;

  const grid = document.createElement('div');
  grid.className = 'dcf-index-grid';
  grid.setAttribute('role', 'list');

  items.forEach(entry => {
    const card = document.createElement('a');
    card.className = 'dcf-index-card';
    card.href = pageFile(entry.id, mode);
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', `${entry.title} — ${entry.cat}`);

    const thumb = document.createElement('div');
    thumb.className = 'dcf-index-thumb';
    const img = document.createElement('img');
    img.src = previewSrc(entry.id, mode);
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => {
      img.remove();
      const fb = document.createElement('div');
      fb.className = 'dcf-index-thumb-fallback';
      fb.textContent = entry.cat;
      thumb.appendChild(fb);
    };
    thumb.appendChild(img);

    const body = document.createElement('div');
    body.className = 'dcf-index-body';
    body.innerHTML = `
      <div class="dcf-index-meta">Nº ${String(entry.n).padStart(2, '0')} · ${entry.cat}</div>
      <h2 class="dcf-index-title">${entry.title}</h2>
      <p class="dcf-index-cat">${entry.id.replace(/-/g, ' ')}</p>`;

    card.append(thumb, body);
    grid.appendChild(card);
  });

  document.body.append(hero, grid);
}


window.DCF_NAV={injectNav,buildIndexPage,pageFile,previewSrc};

})();
</script>
<script>
(function(){
/* Drug Checking Visualization Framework — shared helpers
   Loaded by every standalone visualization. Pure ES module, no dependencies.
   Provides: design tokens (CSS injection), substance classification + palette,
   spectral synthesis (Gaussian chromatograms, stick spectra, FTIR curves),
   formatting, tooltip, and a small DOM scaffold builder. */

const TOKENS = {
  bg:'#0b0e14', panel:'#121826', panel2:'#1a2234', line:'#26304a',
  ink:'#e8ecf4', muted:'#8b94a8', faint:'#5b6478',
  opioid:'#ff8a5c', fent:'#ff5c7a', xyl:'#b388ff', stim:'#ffd166',
  coke:'#4cc9f0', benzo:'#7aa2ff', cut:'#6ee7a8', other:'#94a3b8',
  alert:'#ff5c7a', watch:'#ffd166', ok:'#6ee7a8', info:'#4cc9f0'
};

/* Sans-only UI prose + mono instrument readouts — always terminate with generic family. */
const FONTS = {
  sans:'Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
  mono:'"Cascadia Mono", ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace',
};

/* Map a substance name -> {class, color, label, action} */
const CLASS = {
  fent:{color:TOKENS.fent,label:'Fentanyl & analogs'},
  opioid:{color:TOKENS.opioid,label:'Opioid'},
  xyl:{color:TOKENS.xyl,label:'Sedative / xylazine'},
  stim:{color:TOKENS.stim,label:'Stimulant'},
  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
/* Broad families for filters and labels — cls stays fine-grained for chart colors. */
const FAMILY_MAP = {
  fent:'opioid', opioid:'opioid',
  stim:'stim', coke:'stim',
  xyl:'xyl', benzo:'benzo', cut:'cut', other:'other',
};
const FAMILY_LABEL = {
  opioid:'Opioid',
  stim:'Stimulant',
  xyl:'Sedative / xylazine',
  benzo:'Benzodiazepine',
  cut:'Cut / diluent',
  other:'Other',
};
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES){
    if(re.test(n)){
      const family = FAMILY_MAP[c] || c;
      return {cls:c,color:CLASS[c].color,label:CLASS[c].label,family,familyLabel:FAMILY_LABEL[family]||FAMILY_LABEL.other};
    }
  }
  return {cls:'other',...CLASS.other,family:'other',familyLabel:FAMILY_LABEL.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

/* ---- tooltip ---- */
let _tt;
function tooltip(){
  if(_tt) return _tt;
  _tt=document.createElement('div');
  _tt.style.cssText=`position:fixed;pointer-events:none;z-index:99;background:${TOKENS.panel2};border:1px solid ${TOKENS.line};border-radius:8px;padding:8px 10px;font:12px/1.4 ${FONTS.sans};color:${TOKENS.ink};box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:260px`;
  document.body.appendChild(_tt);
  return {
    show(html,x,y){_tt.innerHTML=html;_tt.style.opacity=1;const r=_tt.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth)nx=x-r.width-14;if(ny+r.height>innerHeight)ny=y-r.height-14;_tt.style.left=nx+'px';_tt.style.top=ny+'px';},
    hide(){_tt.style.opacity=0;}
  };
}

/* ---- page scaffold + global CSS ---- */
function scaffold({tag,title,dek,how,provenance,harm,pageId}={}){
  injectCSS();
  document.body.innerHTML=`
    <header class="dcf-h">
      <div class="dcf-tag">${tag||''}</div>
      <h1>${title||''}</h1>
      <p class="dek">${dek||''}</p>
    </header>
    <main id="stage"></main>

/* draw a 2D structure from SMILES into a <canvas id=...>; needs SmilesDrawer loaded.
   Uses the canvas DrawerBase path (SmilesDrawer.Drawer SVG→canvas is broken in the vendored build). */
let _smilesCanvasDrawer=null;
function smilesCanvasDrawer(w,h){
  if(_smilesCanvasDrawer) return _smilesCanvasDrawer;
  _smilesCanvasDrawer=new SmilesDrawer.SvgDrawer({
    width:w,height:h,padding:14,bondThickness:1.1,
    themes:{
      dcf:{
        C:'#cfd6e4',N:'#7aa2ff',O:'#ff8a5c',F:'#6ee7a8',S:'#ffd166',
        CL:'#6ee7a8',BR:'#ff8a5c',I:'#b388ff',P:'#d35400',B:'#e67e22',SI:'#e67e22',
        H:'#8b94a8',BACKGROUND:'#0e1320',
      },
    },
  }).preprocessor;
  return _smilesCanvasDrawer;
}
function smilesStructureNA(el,h){
  const c=el.getContext&&el.getContext('2d');
  if(c){c.fillStyle='#5b6478';c.font='11px '+FONTS.sans;c.fillText('structure n/a',8,h/2);}
}
function drawSmiles(smiles,canvasId,w=160,h=120){
  const el=document.getElementById(canvasId);
  if(!el||typeof SmilesDrawer==='undefined'||!smiles){ if(el) smilesStructureNA(el,h); return; }
  try{
    const drawer=smilesCanvasDrawer(w,h);
    SmilesDrawer.parse(smiles,t=>{
      try{ drawer.draw(t,el,'dcf',false); }
      catch(_){ try{ drawer.draw(t,el,'dark',false); } catch(__){ smilesStructureNA(el,h); } }
    },()=>{ smilesStructureNA(el,h); });
  }catch(e){ smilesStructureNA(el,h); }
}

const LABEL_RULES = {
  low: { peakMax: 2, mzPct: 0, hiddenTiers: ['peak', 'inline', 'annotation'] },
  default: { peakMax: null, mzPct: 0, hiddenTiers: [] },
  high: { peakMax: null, mzPct: 5, hiddenTiers: [] }
};

let _pageId = '';
let _critique = null;
let _labelTiers = {};
let _state = { theme: 'dark', palette: 'default', labels: 'default' };

function storageKey() { return `dcf-design:${_pageId}`; }

function loadState() {
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) Object.assign(_state, JSON.parse(raw));
  } catch (e) { /* ignore */ }
}

function saveState() {
  try { localStorage.setItem(storageKey(), JSON.stringify(_state)); } catch (e) { /* ignore */ }
}

function applyPalette(paletteId) {
  const pal = PALETTES[paletteId] || PALETTES.default;
  const chrome = pal.chrome[_state.theme] || pal.chrome.dark;
  const root = document.documentElement;
  CHROME_KEYS.forEach(k => {
    const cssKey = k === 'panel2' ? '--panel-2' : `--${k}`;
    root.style.setProperty(cssKey, chrome[k]);
  });
  SUBSTANCE_KEYS.forEach(k => root.style.setProperty(`--c-${k}`, pal.substances[k]));
  SIGNAL_KEYS.forEach(k => root.style.setProperty(`--${k}`, pal.signal[k]));
  root.setAttribute('data-palette', paletteId);
  return pal;
}

function applyTheme(theme) {
  _state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  applyPalette(_state.palette);
}

function applyLabels(mode) {
  _state.labels = mode;
  document.documentElement.setAttribute('data-labels', mode);
}

function getClassColor(cls) {
  const key = cls === 'panel2' ? 'panel2' : cls;
  if (SUBSTANCE_KEYS.includes(key)) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(`--c-${key}`).trim();
    if (v) return v;
  }
  if (SIGNAL_KEYS.includes(key)) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(`--${key}`).trim();
    if (v) return v;
  }
  const pal = PALETTES[_state.palette] || PALETTES.default;
  if (pal.substances[key]) return pal.substances[key];
  if (pal.signal[key]) return pal.signal[key];
  if (pal.chrome[_state.theme]?.[key]) return pal.chrome[_state.theme][key];
  return DCF?.TOKENS?.[key] || '#94a3b8';
}

function peakLabelCount(defaultCount) {
  if (_state.labels === 'low') return Math.min(2, defaultCount);
  if (_state.labels === 'high') return 999;
  const rules = LABEL_RULES[_state.labels] || LABEL_RULES.default;
  if (rules.peakMax != null) return Math.min(rules.peakMax, defaultCount);
  return defaultCount;
}

function mzLabelThreshold() {
  return (LABEL_RULES[_state.labels] || LABEL_RULES.default).mzPct;
}

function showTier(tier) {
  const rules = LABEL_RULES[_state.labels] || LABEL_RULES.default;
  if (rules.hiddenTiers.includes(tier)) return false;
  const tierDef = _labelTiers[tier];
  if (tierDef && tierDef.minLabels === 'low') return _state.labels !== 'low';
  return true;
}

function getPlotlyLayout(base = {}) {
  const chrome = (PALETTES[_state.palette] || PALETTES.default).chrome[_state.theme];
  const showAxis = showTier('axis');
  const showLegend = showTier('legend');
  const layout = {
    paper_bgcolor: chrome.bg,
    plot_bgcolor: chrome.panel,
    font: { color: chrome.ink, family: (typeof DCF !== 'undefined' && DCF.FONTS?.sans) || 'Inter, ui-sans-serif, system-ui, sans-serif' },
    colorway: SUBSTANCE_KEYS.map(k => getClassColor(k)),
    ...base
  };
  if (layout.xaxis) layout.xaxis = { ...layout.xaxis, showticklabels: showAxis, color: chrome.muted };
  else layout.xaxis = { showticklabels: showAxis, color: chrome.muted };
  if (layout.yaxis) layout.yaxis = { ...layout.yaxis, showticklabels: showAxis, color: chrome.muted };
  else layout.yaxis = { showticklabels: showAxis, color: chrome.muted };
  if (layout.scene) {
    layout.scene = {
      ...layout.scene,
      bgcolor: chrome.bg,
      xaxis: { ...(layout.scene.xaxis || {}), color: chrome.muted, showticklabels: showAxis },
      yaxis: { ...(layout.scene.yaxis || {}), color: chrome.muted, showticklabels: showAxis },
      zaxis: { ...(layout.scene.zaxis || {}), color: chrome.muted, showticklabels: showAxis }
    };
  }
  if (layout.legend) layout.legend = { ...layout.legend, visible: showLegend };
  return layout;
}

  return (PALETTES[_state.palette] || PALETTES.default).colorscale;

  const el = document.querySelector('.critique-live');

    _critique.liveNoteTemplates.default || '';
  const pal = PALETTES[_state.palette]?.name || _state.palette;
  const theme = _state.theme === 'light' ? 'Light' : 'Dark';
  el.textContent = tpl.replace(/\{theme\}/g, theme).replace(/\{palette\}/g, pal).replace(/\{labels\}/g, _state.labels);
}

function buildToolbar() {
  const bar = document.createElement('div');
  bar.className = 'dcf-design-bar';
  bar.setAttribute('role', 'toolbar');
  bar.setAttribute('aria-label', 'Design Lab controls');

  const themeGroup = document.createElement('div');
  themeGroup.className = 'dcf-design-group';
  themeGroup.innerHTML = '<span class="dcf-design-label">Theme</span>';
  ['dark', 'light'].forEach(t => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dcf-design-btn';
    btn.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    btn.setAttribute('aria-pressed', String(_state.theme === t));
    btn.dataset.theme = t;
    btn.onclick = () => {
      _state.theme = t;
      themeGroup.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
      onSettingChange();
    };
    themeGroup.appendChild(btn);
  });

  const palGroup = document.createElement('div');
  palGroup.className = 'dcf-design-group dcf-design-palette';
  palGroup.innerHTML = '<span class="dcf-design-label">Palette</span>';
  const sel = document.createElement('select');
  sel.id = 'dcf-palette-select';
  sel.className = 'dcf-design-select';
  sel.setAttribute('aria-label', 'Color palette');
  ['recommended', 'custom'].forEach(grp => {
    const og = document.createElement('optgroup');
    og.label = grp === 'recommended' ? 'Recommended' : 'Custom';
    Object.values(PALETTES).filter(p => p.group === grp).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      if (p.id === _state.palette) opt.selected = true;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
  sel.onchange = () => {
    _state.palette = sel.value;
    renderSwatches(sel.value);
    onSettingChange();
  };
  const swatchStrip = document.createElement('div');
  swatchStrip.id = 'dcf-palette-swatches';
  swatchStrip.className = 'dcf-palette-swatches';
  swatchStrip.setAttribute('aria-hidden', 'true');
  palGroup.append(sel, swatchStrip);

  const lblGroup = document.createElement('div');
  lblGroup.className = 'dcf-design-group';
  lblGroup.innerHTML = '<span class="dcf-design-label">Labels</span>';
  ['low', 'default', 'high'].forEach(l => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dcf-design-btn';
    btn.textContent = l.charAt(0).toUpperCase() + l.slice(1);
    btn.setAttribute('aria-pressed', String(_state.labels === l));
    btn.dataset.labels = l;
    btn.onclick = () => {
      _state.labels = l;
      lblGroup.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.labels === l)));
      onSettingChange();
    };
    lblGroup.appendChild(btn);
  });

  bar.append(themeGroup, palGroup, lblGroup);
  renderSwatches(_state.palette);
  return bar;
}

function buildCritiquePanel(critique) {
  const aside = document.createElement('aside');
  aside.className = 'dcf-critique';
  aside.setAttribute('aria-labelledby', 'critique-heading');
  const strengths = (critique.strengths || []).map(s => `<li>${s}</li>`).join('');
  const weaknesses = (critique.weaknesses || []).map(s => `<li>${s}</li>`).join('');
  aside.innerHTML = `
    <h2 id="critique-heading">Design assessment</h2>
    <p class="critique-thesis">${critique.thesis || ''}</p>
    <div class="critique-grid">
      <section><h3>Strengths</h3><ul>${strengths}</ul></section>
      <section><h3>Weaknesses</h3><ul>${weaknesses}</ul></section>
      <section><h3>Visualization</h3><p>${critique.visualization || ''}</p></section>
    </div>
    <p class="critique-live muted" aria-live="polite"></p>`;
  return aside;
}

function injectDesignCSS() {
  if (document.getElementById('dcf-design-css')) return;
  const s = document.createElement('style');
  s.id = 'dcf-design-css';
  s.textContent = `
  .dcf-design-bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:0;z-index:20}
  .dcf-design-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dcf-design-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
  .dcf-design-btn,.dcf-design-select{min-height:40px;min-width:40px;padding:8px 14px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);border-radius:999px;font:500 13px var(--font-sans);cursor:pointer;transition:background .15s,color .15s}
  .dcf-design-select{border-radius:10px;padding-right:28px}
  .dcf-design-btn:hover,.dcf-design-select:hover{background:var(--panel);color:var(--ink)}
  .dcf-design-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .dcf-design-palette{gap:10px}
  .dcf-palette-swatches{display:flex;gap:3px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .dcf-palette-swatches span{display:block;width:18px;height:24px}
  .dcf-critique{margin:22px 0;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .dcf-critique h2{font-size:15px;margin:0 0 10px;font-weight:700}
  .critique-thesis{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 14px;max-width:72ch}
  .critique-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:12px}
  .dcf-critique h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
  .dcf-critique ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--muted)}
  .dcf-critique section p{font-size:13px;line-height:1.55;color:var(--muted);margin:0}
  .critique-live{font-size:12px;margin:8px 0 0;padding-top:10px;border-top:1px solid var(--line)}
  [data-labels="low"] .dcf-lbl[data-tier="peak"],
  [data-labels="low"] .dcf-lbl[data-tier="inline"],
  [data-labels="low"] .dcf-lbl[data-tier="annotation"]{display:none}
  [data-labels="low"] .dcf-lbl[data-tier="legend"]{opacity:.6}
  @media (prefers-reduced-motion:reduce){.dcf-design-btn,.dcf-design-select{transition:none}}
  `;
  document.head.appendChild(s);
}

function designScaffold(opts) {
  injectDesignCSS();
  const stage = DCF.scaffold(opts);
  injectDesignChrome();
  document.documentElement.setAttribute('data-theme', _state.theme);
  document.documentElement.setAttribute('data-labels', _state.labels);
  applyPalette(_state.palette);
  updateLiveNote();
  return stage;
}

let _patched = false;

function init(meta = {}) {
  _pageId = meta.pageId || '';
  _critique = meta.critique || null;
  _labelTiers = meta.labelTiers || {};
  loadState();
  if (!_patched && DCF?.scaffold) {
    _patched = true;
    const orig = DCF.scaffold;
    DCF.scaffold = function patchedScaffold(o) {
      injectDesignCSS();
      const st = orig(o);
      injectDesignChrome();
      document.documentElement.setAttribute('data-theme', _state.theme);
      document.documentElement.setAttribute('data-labels', _state.labels);
      applyPalette(_state.palette);
      updateLiveNote();
      return st;
    };
  }
}

function injectDesignChrome() {
  const hdr = document.querySelector('.dcf-h');
  const howEl = document.querySelector('.dcf-how');
  if (hdr && !document.querySelector('.dcf-design-bar')) hdr.after(buildToolbar());
  if (howEl && _critique && !document.querySelector('.dcf-critique')) {
    howEl.before(buildCritiquePanel(_critique));
    updateLiveNote();
  }
}

window.DCFDesign={PALETTES,init,designScaffold,applyPalette,applyTheme,applyLabels,getClassColor,peakLabelCount,showTier,mzLabelThreshold,getPlotlyLayout,getColorscale,injectDesignCSS};

})();

window.DCF_DESIGN_META = {"pageId":"03-ftir-overlay","critique":{"thesis":"The subtraction bench teaches residual interpretation well, but mixture chip controls and the fingerprint callout compete vertically with the spectrum.","strengths":["Fingerprint region shading encodes FTIR convention","Residual fill makes unexplained signal visceral","Toggle chips support interactive what-if subtraction","Harm-reduction note on fent detection floor"],"weaknesses":["Wavenumber ticks always on \u2014 no label density control","Residual color hardcoded to TOKENS.fent","Legend sits below without tier gating","Chip rows stack on narrow viewports"],"visualization":"Full-bleed spectrum panel with floating residual legend overlay keeps focus on the unexplained signal band.","liveNoteTemplates":{"default":"Current settings: {theme} chrome \u00b7 {palette} palette \u00b7 {labels} label density.","low":"Low label mode hides peak and inline annotations \u2014 rely on hover and tooltips.","high":"High label mode surfaces more annotations \u2014 may crowd on mobile viewports."}},"labelTiers":{"axis":{"desc":"Axis tick numbers and unit labels","minLabels":"always"},"legend":{"desc":"Legend swatches and class key","minLabels":"default"},"peak":{"desc":"Peak or fragment annotations","minLabels":"default"},"inline":{"desc":"Inline substance or region labels","minLabels":"default"},"annotation":{"desc":"Control labels and disclosure copy","minLabels":"always"}}};
DCFDesign.init(window.DCF_DESIGN_META);

<script>
/* Design Lab layout signature — FTIR Overlay & Subtraction Bench */
(function(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  stage.classList.add('dcf-design-03');
  if(!document.getElementById('dcf-design-sig-03_ftir_overlay')){
    const s=document.createElement('style');
    s.id='dcf-design-sig-03_ftir_overlay';
    s.textContent=`.dcf-design-ftir .panel{border-left:4px solid var(--c-fent)}`;
    document.head.appendChild(s);

<script>
/* Nº 03 · FTIR Overlay & Subtraction Bench — overlay a mixed street sample's
   infrared spectrum against pure reference components, then subtract them one by
   one to see what signal is "left over" (the unexplained residual). */
const {ftirCurve,classify,tooltip,fmt,TOKENS}=DCF;
const scaffold=(o)=>DCF.scaffold(o);
function subColor(name){const c=classify(name);return window.DCFDesign?DCFDesign.getClassColor(c.cls):c.color;}
function sigColor(k){return window.DCFDesign?DCFDesign.getClassColor(k):TOKENS[k];}
const F=SPEC.ftir;
const refs=Object.keys(F).filter(k=>Array.isArray(F[k]));

const stage=scaffold({
  tag:'Nº 03 · FTIR',
  title:'FTIR Overlay & Subtraction Bench',
  dek:'On-site FTIR reads a sample\'s infrared "molecular barcode." Build a synthetic mixture, then peel off known components to reveal what can\'t yet be explained.',
  how:`<b>FTIR</b> shines infrared light through a sample; chemical bonds absorb specific frequencies, producing bands at characteristic <b>wavenumbers</b> (<span class="mono">cm⁻¹</span>, plotted high→low by convention). The cluttered <b>fingerprint region</b> (1500–400, shaded) is nearly unique per molecule. A field tech identifies a mixture by matching and <b>subtracting</b> reference spectra; whatever signal remains (the <b>residual</b>) may be an unidentified or trace component — exactly where novel adulterants hide. <b>Limits:</b> FTIR struggles below ~5% of a mixture and can miss potent drugs present in tiny amounts (like fentanyl).`,
  provenance:'Band positions illustrative of characteristic functional-group absorptions; intensities approximate.',
  harm:'FTIR can miss fentanyl and other potent drugs present below its detection floor. A "clean" FTIR result is not an all-clear — use test strips too.'
});

stage.innerHTML=`
<div class="controls" id="mixctl"><span class="muted" style="font-size:13px">Mixture contains:</span></div>
<div class="controls" id="subctl"><span class="muted" style="font-size:13px">Subtract reference:</span></div>
<div class="panel"><svg id="svg" width="100%" height="420" role="img" aria-label="FTIR overlay and residual"></svg></div>
<div class="legend" id="leg"></div>`;

const mix=new Set(['fentanyl','caffeine','lactose']);
const subtracted=new Set();
const tt=tooltip();

function chips(host,set,onToggle,active){
  host.querySelectorAll('button').forEach(b=>b.remove());
  refs.forEach(r=>{
    const b=document.createElement('button'); b.className='tgl'; b.textContent=r;
    b.setAttribute('aria-pressed',set.has(r));
    b.onclick=()=>{onToggle(r);render();};
    host.appendChild(b);
  });
}
function render(){
  chips(document.getElementById('mixctl'),mix,r=>{mix.has(r)?mix.delete(r):mix.add(r);subtracted.delete(r);});
  chips(document.getElementById('subctl'),subtracted,r=>{if(mix.has(r))subtracted.has(r)?subtracted.delete(r):subtracted.add(r);});
  draw();
}

function curveFor(set){
  // sum band lists, scaled equally
  const bands=[];
  set.forEach(r=>F[r].forEach(b=>bands.push(b)));
  return ftirCurve(bands);
}
function draw(){
  const svg=d3.select('#svg'); svg.selectAll('*').remove();
  const W=svg.node().clientWidth,H=420,m={t:20,r:16,b:40,l:30};
  const total=curveFor(mix);
  const resid=curveFor(new Set([...mix].filter(r=>!subtracted.has(r))));
  const sub=curveFor(subtracted);
  const x=d3.scaleLinear([4000,400],[m.l,W-m.r]); // reversed
  const ymax=Math.max(...total.y,1)*1.1;
  const y=d3.scaleLinear([0,ymax],[H-m.b,m.t]);
  // fingerprint shading
  svg.append('rect').attr('x',x(1500)).attr('y',m.t).attr('width',x(400)-x(1500)).attr('height',H-m.b-m.t).attr('fill',TOKENS.panel2).attr('opacity',.5);
  svg.append('text').attr('x',(x(1500)+x(400))/2).attr('y',m.t+13).attr('text-anchor','middle').attr('fill',TOKENS.faint).attr('font-size',10).text('fingerprint region');
  if(!window.DCFDesign||DCFDesign.showTier('axis'))
  [4000,3000,2000,1500,1000,500].forEach(t=>{
    svg.append('line').attr('x1',x(t)).attr('x2',x(t)).attr('y1',m.t).attr('y2',H-m.b).attr('stroke',TOKENS.line).attr('opacity',.4);
    svg.append('text').attr('class','dcf-lbl').attr('data-tier','axis').attr('x',x(t)).attr('y',H-14).attr('text-anchor','middle').attr('fill',TOKENS.faint).attr('font-size',11).attr('font-family','ui-monospace').text(t);
  });
  if(!window.DCFDesign||DCFDesign.showTier('axis'))
  svg.append('text').attr('class','dcf-lbl').attr('data-tier','axis').attr('x',W/2).attr('y',H-2).attr('text-anchor','middle').attr('fill',TOKENS.muted).attr('font-size',11).text('wavenumber (cm⁻¹) — high to low');

  const line=d3.line().x((d,i)=>x(total.x[i])).y(d=>y(d)).curve(d3.curveBasis);
  // total mixture (faint)
  svg.append('path').datum(total.y).attr('d',line).attr('fill','none').attr('stroke',TOKENS.muted).attr('stroke-width',1).attr('opacity',.5).attr('stroke-dasharray','3,3');
  // subtracted refs (each colored)
  if(subtracted.size){
    svg.append('path').datum(sub.y).attr('d',d3.line().x((d,i)=>x(sub.x[i])).y(d=>y(d)).curve(d3.curveBasis)).attr('fill','none').attr('stroke',TOKENS.faint).attr('stroke-width',1.1).attr('opacity',.6);
  }
  // residual (bold gradient fill)
  const area=d3.area().x((d,i)=>x(resid.x[i])).y0(y(0)).y1(d=>y(d)).curve(d3.curveBasis);
  const g=svg.append('defs').append('linearGradient').attr('id','rg').attr('x1',0).attr('x2',0).attr('y1',0).attr('y2',1);
  g.append('stop').attr('offset','0%').attr('stop-color',sigColor('fent')).attr('stop-opacity',.4);
  g.append('stop').attr('offset','100%').attr('stop-color',sigColor('fent')).attr('stop-opacity',.03);
  svg.append('path').datum(resid.y).attr('d',area).attr('fill','url(#rg)');
  svg.append('path').datum(resid.y).attr('d',d3.line().x((d,i)=>x(resid.x[i])).y(d=>y(d)).curve(d3.curveBasis)).attr('fill','none').attr('stroke',sigColor('fent')).attr('stroke-width',1.8);
  svg.on('mousemove',e=>{const wn=Math.round(x.invert(e.offsetX));if(wn>400&&wn<4000)tt.show(`<b class="mono">${wn} cm⁻¹</b>`,e.clientX,e.clientY);}).on('mouseleave',tt.hide);

  if(!window.DCFDesign||DCFDesign.showTier('legend'))
  document.getElementById('leg').innerHTML=
    `<span><i style="background:${TOKENS.muted}"></i>full mixture</span>
     <span><i style="background:${sigColor('fent')}"></i>residual after subtraction (${[...mix].filter(r=>!subtracted.has(r)).length} components left)</span>
     <span class="faint">subtracting ${subtracted.size||'none'} reference${subtracted.size===1?'':'s'}</span>`;
}
render();
window.__vizRedraw=draw;
addEventListener('resize',draw);

</script>
