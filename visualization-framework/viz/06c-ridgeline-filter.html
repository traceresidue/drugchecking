};

// A "variant" page is an alternate take on a canonical numbered visualization —
// e.g. 06b-ridgeline-3d is a variant of 06-spectral-ridgeline. Variants use the
// `<number><letter>-slug` id convention (already relied on above by
// PREVIEW_FALLBACK and below by navLabel's suffix logic); canonical pages use
// a bare `<number>-slug`. Inferring from the id — rather than a manually-set
// registry flag — means every future page is classified correctly for free as
// long as it follows this existing naming convention, with no separate field
// to remember to set (and no risk of the field and the id silently drifting
// apart).
function isVariantId(id) {
  return /^\d+[a-z]-/.test(id);
}

function pageFile(id, mode) {
  return mode === 'lab' ? `d-${id}.html` : `${id}.html`;
}

function previewId(id) {
  return PREVIEW_FALLBACK[id] || id;
}

function previewSrc(id, mode) {
  const base = mode === 'lab' ? '../viz/review-previews' : 'review-previews';
  return `${base}/${previewId(id)}.png`;
}

function navLabel(entry) {
  const n = String(entry.n).padStart(2, '0');
  const suffix = isVariantId(entry.id) ? ` · ${entry.id.split('-').slice(1).join(' ')}` : '';
  return `Nº ${n} · ${entry.title}${suffix}`;
}

function injectNav({ pageId, mode = 'viz' } = {}) {
  if (!pageId || document.querySelector('.dcf-nav')) return;
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  if (!items.length) return;

  const idx = items.findIndex(e => e.id === pageId);
  const cur = idx >= 0 ? idx : 0;
  const prev = items[(cur - 1 + items.length) % items.length];
  const next = items[(cur + 1) % items.length];

  const nav = document.createElement('nav');
  nav.className = 'dcf-nav';
  nav.setAttribute('aria-label', 'Visualization series navigation');

  const home = document.createElement('a');
  home.className = 'dcf-nav-home';
  home.href = 'index.html';
  home.textContent = mode === 'lab' ? 'Design Lab' : 'All viz';

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.className = 'dcf-nav-btn';
  prevBtn.setAttribute('aria-label', `Previous: ${prev.title}`);
  prevBtn.textContent = '←';
  prevBtn.onclick = () => { location.href = pageFile(prev.id, mode); };

  const sel = document.createElement('select');
  sel.className = 'dcf-nav-select';
  sel.setAttribute('aria-label', 'Jump to visualization');
  items.forEach(entry => {
    const opt = document.createElement('option');
    opt.value = pageFile(entry.id, mode);
    opt.textContent = navLabel(entry);
    if (entry.id === pageId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { if (sel.value) location.href = sel.value; };

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'dcf-nav-btn';
  nextBtn.setAttribute('aria-label', `Next: ${next.title}`);
  nextBtn.textContent = '→';
  nextBtn.onclick = () => { location.href = pageFile(next.id, mode); };

  const pos = document.createElement('span');
  pos.className = 'dcf-nav-pos';
  pos.textContent = `${cur + 1} / ${items.length}`;

  nav.append(home, prevBtn, sel, nextBtn, pos);

  const hdr = document.querySelector('.dcf-h');
  if (hdr) document.body.insertBefore(nav, hdr);
  else document.body.prepend(nav);
}

function renderCard(entry, mode, { showVariantBadge = false } = {}) {
  const card = document.createElement('a');
  card.className = 'dcf-index-card';
  card.href = pageFile(entry.id, mode);
  card.setAttribute('role', 'listitem');
  card.setAttribute('aria-label', `${entry.title} — ${entry.cat}${showVariantBadge ? ' — variant' : ''}`);

  const thumb = document.createElement('div');
  thumb.className = 'dcf-index-thumb';
  const img = document.createElement('img');
  img.src = previewSrc(entry.id, mode);
  img.alt = '';
  img.loading = 'lazy';
  img.onerror = () => {
    img.remove();
    const fb = document.createElement('div');
    fb.className = 'dcf-index-thumb-fallback';
    fb.textContent = entry.cat;
    thumb.appendChild(fb);
  };
  thumb.appendChild(img);

  const body = document.createElement('div');
  body.className = 'dcf-index-body';
  body.innerHTML = `
    <div class="dcf-index-meta">Nº ${String(entry.n).padStart(2, '0')} · ${entry.cat}${showVariantBadge ? '<span class="dcf-index-variant-badge">Variant</span>' : ''}</div>
    <h2 class="dcf-index-title">${entry.title}</h2>
    <p class="dcf-index-cat">${entry.id.replace(/-/g, ' ')}</p>`;

  card.append(thumb, body);
  return card;
}

function renderGrid(entries, mode, opts) {
  const grid = document.createElement('div');
  grid.className = 'dcf-index-grid';
  grid.setAttribute('role', 'list');
  entries.forEach(entry => grid.appendChild(renderCard(entry, mode, opts)));
  return grid;
}

function buildIndexPage({ mode = 'viz', title, dek, switchHref } = {}) {
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  const canonical = items.filter(entry => !isVariantId(entry.id));
  const variants = items.filter(entry => isVariantId(entry.id));
  const prodHref = mode === 'lab' ? '../viz/index.html' : 'index.html';
  const labHref = mode === 'lab' ? 'index.html' : (switchHref || '../viz2/index.html');
  const hero = document.createElement('header');
  hero.className = 'dcf-index-hero';
  hero.innerHTML = `
    <h1>${title || 'Drug Checking Visualizations'}</h1>
    <p>${dek || ''}</p>
    <div class="dcf-index-switch">
      <a href="${prodHref}" aria-current="${mode === 'viz' ? 'page' : 'false'}">Production viz</a>
      <a href="${labHref}" aria-current="${mode === 'lab' ? 'page' : 'false'}">Design Lab</a>
    </div>`;

  // Primary, curated list: canonical numbered pages only (no a/b/c suffix).
  const grid = renderGrid(canonical, mode);

  document.body.append(hero, grid);

  // Secondary, clearly-labeled section: alternate takes on a canonical page
  // (same number, a/b/c suffix). Collapsed by default so a first-time viewer
  // sees the curated canonical list first, with variants one click away.
  if (variants.length) {
    const section = document.createElement('details');
    section.className = 'dcf-variants';
    const summary = document.createElement('summary');
    summary.textContent = `Variant explorations (${variants.length})`;
    const dekEl = document.createElement('p');
    dekEl.className = 'dcf-variants-dek';
    dekEl.textContent = 'Alternate takes on canonical numbered pages above — different chart forms or framings explored for the same data. Kept for reference, not part of the primary tour.';
    const variantGrid = renderGrid(variants, mode, { showVariantBadge: true });
    section.append(summary, dekEl, variantGrid);
    document.body.append(section);
  }
}


window.DCF_NAV={injectNav,buildIndexPage,pageFile,previewSrc};

})();

const FAMILY_LABEL = {

      return {cls:c,color:CLASS[c].color,label:CLASS[c].label,family,familyLabel:FAMILY_LABEL[family]||FAMILY_LABEL.other};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

let _smilesCanvasDrawer=null;
function smilesCanvasDrawer(w,h){
  if(_smilesCanvasDrawer) return _smilesCanvasDrawer;

        H:'#8b94a8',BACKGROUND:'#0e1320',

function smilesStructureNA(el,h){

}

      try{ drawer.draw(t,el,'dcf',false); }
      catch(_){ try{ drawer.draw(t,el,'dark',false); } catch(__){ smilesStructureNA(el,h); } }
    },()=>{ smilesStructureNA(el,h); });
  }catch(e){ smilesStructureNA(el,h); }
}

function domainForSubstance(rows,substance){

function drawFocusChromatogram(container,rows,sampleNum,keyId,domain){
  const svg=d3.select(container);
  svg.selectAll('*').remove();
  const node=svg.node();

    .attr('fill',TOKENS.panel2).attr('stroke',TOKENS.line).attr('rx',4);
  if(trace.y.length){

    svg.append('path').datum(trace.y).attr('d',area).attr('fill',hue).attr('opacity',kp?0.14:0.04);
    svg.append('path').datum(trace.y)
      .attr('d',d3.line().x((d,k)=>x(trace.x[k])).y(d=>y(d)).curve(d3.curveBasis))
      .attr('fill','none').attr('stroke',TOKENS.ink).attr('stroke-width',1.2).attr('opacity',0.75);
  }
  svg.append('line').attr('x1',x(st.meanRt)).attr('x2',x(st.meanRt)).attr('y1',m.t).attr('y2',H-m.b)
    .attr('stroke',hue).attr('stroke-width',1.5).attr('opacity',0.55).attr('stroke-dasharray','4,3');
  if(kp){

  }
  svg.append('text').attr('x',m.l+6).attr('y',m.t+11).attr('fill',TOKENS.muted).attr('font-size',10)
    .text(`Sample #${sampleNum} · ${meta.label}${kp?' · RT '+kp.rt.toFixed(2):' · absent'}`);
  svg.append('text').attr('x',W/2).attr('y',H-4).attr('text-anchor','middle').attr('fill',TOKENS.faint).attr('font-size',10)
    .text('retention time (min)');
}

function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function baseRt(s){return RT[s]||EXTRA_RT[s]||8;}

function sampleRows(mode,opts={}){
  const cfg=PALETTE[mode];
  const r=rng(mode==='stable'?7:42);
  const rows=[];
  if(opts.classFilter){
    const drugs=DRUGS_BY_CLASS[opts.classFilter];
    for(let i=0;i<SAMPLE_COUNT;i++){
      const age=i/SAMPLE_COUNT;
      const peaks=[];
      drugs.forEach((s,di)=>{
        const isCore=di<2;
        const drop=isCore?cfg.drop*0.35:cfg.drop*1.1;
        if(r()>drop){
          const rtW=isCore?cfg.rtSigma*0.75:cfg.rtSigma*(mode==='volatile'?1.4:1);
          peaks.push({
            s,
            rt:baseRt(s)+(r()-0.5)*rtW,
            amp:(30+r()*60)*(1+(r()-0.5)*cfg.ampSigma)*(isCore?1.1:0.85),
            sigma:0.05
          });
        }
      });
      if(mode==='volatile' && opts.classFilter==='opioid' && age>0.4 && r()<0.35){
        const s='p-fluorofentanyl';
        if(!peaks.some(p=>p.s===s)) peaks.push({s,rt:baseRt(s)+(r()-0.5)*cfg.rtSigma*1.6,amp:18+r()*40,sigma:0.05});
      }
      rows.push(peaks);
    }
    return rows;
  }
  const pool=[...cfg.core,...cfg.variable,...(cfg.emerge?[cfg.emerge]:[]),'xylazine','heroin','p-fluorofentanyl','methamphetamine','cocaine','diphenhydramine'];
  for(let i=0;i<SAMPLE_COUNT;i++){
    const age=i/SAMPLE_COUNT;
    const peaks=[];
    const add=(s,opts2={})=>{
      const isCore=cfg.core.includes(s);
      const drop=isCore?cfg.drop*0.4:cfg.drop;
      if(r()>drop){
        const rtW=opts2.rtWide?cfg.rtSigma*1.8:cfg.rtSigma;
        peaks.push({
          s,
          rt:baseRt(s)+(r()-0.5)*rtW*(isCore?0.7:1),
          amp:(opts2.amp||35+r()*55)*(s==='fentanyl'?1.15:0.85)*(1+(r()-0.5)*cfg.ampSigma),
          sigma:0.05
        });
      }
    };
    cfg.core.forEach(s=>add(s));
    cfg.variable.forEach(s=>{ if(r()>0.18) add(s); });
    if(cfg.emerge && age>0.32 && r()<(age-0.25)*1.1) add(cfg.emerge,{rtWide:true,amp:22});
    if(r()<0.28) add('heroin');
    if(r()<0.22) add('p-fluorofentanyl');
    if(r()<0.18) add('methamphetamine',{rtWide:true});
    if(r()<0.14) add('cocaine');
    rows.push(peaks);
  }
  return rows;
}

function hexRgb(hex){
  const h=hex.replace('#','');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function rgbHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0,s=0,l=(mx+mn)/2;
  if(d){
    s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r) h=((g-b)/d+(g<b?6:0))/6;
    else if(mx===g) h=((b-r)/d+2)/6;
    else h=((r-g)/d+4)/6;
  }
  return [h*360,s,l];
}
function hslCss(h,s,l){return `hsl(${((h%360)+360)%360},${(s*100).toFixed(0)}%,${(l*100).toFixed(0)}%)`;}
function devColor(baseHex,t){
  const [r,g,b]=hexRgb(baseHex);
  let [h,s,l]=rgbHsl(r,g,b);
  const spread=Math.min(1,Math.max(0,t));
  h+=spread*52*(spread>0.5?1:-1);
  s=Math.min(0.95,s+spread*0.28);
  l=Math.max(0.22,Math.min(0.78,l+(spread-0.45)*0.18));
  return hslCss(h,s,l);
}

function computeDrugStats(rows,substance){
  const hits=rows.map(peaks=>peaks.find(p=>p.s===substance)).filter(Boolean);
  const rts=hits.map(p=>p.rt), amps=hits.map(p=>p.amp);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:baseRt(substance);
  const std=(a,mu)=>a.length?Math.sqrt(a.reduce((s,v)=>s+(v-mu)**2,0)/a.length):0;
  const meanRt=mean(rts), meanAmp=mean(amps)||50;
  return {
    substance, meanRt, meanAmp,
    stdRt:Math.max(std(rts,meanRt),0.025),
    stdAmp:Math.max(std(amps,meanAmp),4),
    presence:hits.length/rows.length,
    hits
  };
}

function normDev(peak,stats){
  if(!peak) return 1;
  const rtD=Math.abs(peak.rt-stats.meanRt)/Math.max(stats.stdRt*2.2,0.04);
  const ampD=Math.abs(peak.amp-stats.meanAmp)/Math.max(stats.stdAmp*2.2,8);
  return Math.min(1,(rtD*0.55+ampD*0.45)/2.2);
}

function activeDrugs(rows,classFilter){
  const pool=classFilter?DRUGS_BY_CLASS[classFilter]:ALL_TRACKED;
  return pool.filter(s=>rows.some(peaks=>peaks.some(p=>p.s===s))||pool.indexOf(s)<4);
}

function idealPeaks(drugs,rows){
  return drugs.map(s=>{
    const st=computeDrugStats(rows,s);
    return {s,rt:st.meanRt,amp:st.meanAmp,sigma:0.04};
  });
}

function layout(H,refH=38){
  const labelH=72,refGap=10;
  return {
    t:16,r:18,b:labelH,l:52,
    refH,refGap,
    refTop:H-labelH-refGap-refH,
    refBottom:H-labelH-refGap
  };
}

function sampleBand(H,m){return H-m.t-m.b-m.refH-m.refGap;}

function ySample(i,m,H,rows){
  return m.t+(i+1)*(sampleBand(H,m)/rows.length);
}
function rowPitch(H,m,rows){return sampleBand(H,m)/rows.length;}

function rowYScale(i,m,H,rows,overlap){
  const baseY=ySample(i,m,H,rows);
  return d3.scaleLinear([0,100],[baseY,baseY-overlap*rowPitch(H,m,rows)]);
}

function substancePeakOnRow(peaks,sub,x,yScale,domain,peakFilter){
  const p=peaks.find(pk=>pk.s===sub);
  if(!p)return null;
  const rowPeaks=peakFilter?peakFilter(peaks):peaks;
  if(!rowPeaks.some(rp=>rp.s===sub))return null;
  const trace=chromatogram(rowPeaks,{x0:domain[0],x1:domain[1],sigma:0.05,n:140});
  const halfWin=Math.max(0.08,(domain[1]-domain[0])*0.04);
  let maxV=-1,maxI=0;
  trace.x.forEach((t,k)=>{
    if(Math.abs(t-p.rt)<=halfWin&&trace.y[k]>maxV){maxV=trace.y[k];maxI=k;}
  });
  if(maxV<0){
    maxI=trace.x.reduce((best,t,k)=>Math.abs(t-p.rt)<Math.abs(trace.x[best]-p.rt)?k:best,0);
  }
  return {x:x(trace.x[maxI]),y:yScale(trace.y[maxI])};
}

function drawReferenceRow(svg,x,drugs,rows,x0,x1,m){
  const ideal=idealPeaks(drugs,rows);
  const yScale=d3.scaleLinear([0,100],[m.refBottom,m.refTop]);
  const g=svg.append('g').attr('class','ref-row');
  g.append('text').attr('x',x(x0)-8).attr('y',yScale(52)+4).attr('text-anchor','end')
    .attr('fill',TOKENS.muted).attr('font-size',9).attr('font-family','ui-monospace').text('ideal');
  ideal.forEach(p=>{
    const trace=chromatogram([p],{x0,x1,sigma:0.032,n:160});
    g.append('path').datum(trace.y)
      .attr('d',d3.line().x((d,k)=>x(trace.x[k])).y(d=>yScale(d)).curve(d3.curveBasis))
      .attr('fill','none').attr('stroke',drugHue(p.s)).attr('stroke-width',1.7).attr('opacity',0.88);
    g.append('circle').attr('cx',x(p.rt)).attr('cy',yScale(100)).attr('r',3)
      .attr('fill',drugHue(p.s)).attr('stroke',TOKENS.bg).attr('stroke-width',0.6);
  });
  g.append('line').attr('x1',x(x0)).attr('x2',x(x1)).attr('y1',yScale(0)).attr('y2',yScale(0))
    .attr('stroke',TOKENS.line).attr('stroke-dasharray','3,3').attr('opacity',0.5);
}

function drawVariabilityColumns(svg,{rows,drugs,x,m,H,domain,overlap,peakFilter}){
  const pitch=rowPitch(H,m,rows);
  const topY=ySample(0,m,H,rows)-pitch*0.15;
  const bottomY=ySample(rows.length-1,m,H,rows)+pitch*0.15;
  const pathLine=d3.line()
    .x(d=>d.x)
    .y(d=>d.y)
    .curve(d3.curveCatmullRom.alpha(0.62));

  drugs.forEach(sub=>{
    const stats=computeDrugStats(rows,sub);
    const hue=drugHue(sub);
    const cx=x(stats.meanRt);
    const g=svg.append('g').attr('class','var-col').attr('data-drug',sub);

    const pts=rows.map((peaks,i)=>{
      const baseY=ySample(i,m,H,rows);
      const yScale=rowYScale(i,m,H,rows,overlap);
      const apex=substancePeakOnRow(peaks,sub,x,yScale,domain,peakFilter);
      return apex||{x:cx,y:baseY};
    });

    g.append('line')
      .attr('class','var-col-axis')
      .attr('x1',cx).attr('x2',cx)
      .attr('y1',topY).attr('y2',bottomY)
      .attr('stroke',hue).attr('stroke-width',1).attr('opacity',0.32);

    g.append('path')
      .attr('class','var-path')
      .attr('d',pathLine(pts))
      .attr('fill','none')
      .attr('stroke',hue)
      .attr('stroke-width',2.4)
      .attr('stroke-linecap','round')
      .attr('stroke-linejoin','round')
      .attr('opacity',0.82);

    rows.forEach((peaks,i)=>{
      const p=peaks.find(pk=>pk.s===sub);
      const y=ySample(i,m,H,rows);
      const dev=p?normDev(p,stats):1;
      const col=devColor(hue,dev);

      g.append('circle')
        .attr('class','var-ideal-dot')
        .attr('cx',cx).attr('cy',y)
        .attr('r',p?2.4:1.8)
        .attr('fill',p?col:TOKENS.faint)
        .attr('stroke',TOKENS.bg)
        .attr('stroke-width',0.6)
        .attr('opacity',p?0.92:0.38);
    });
  });
}

function drawDrugLabels(svg,drugs,rows,x,H,m){
  drugs.forEach(sub=>{
    const st=computeDrugStats(rows,sub);
    const cx=x(st.meanRt);
    const hue=drugHue(sub);
    svg.append('line').attr('x1',cx).attr('x2',cx).attr('y1',H-m.b).attr('y2',H-m.b+6)
      .attr('stroke',hue).attr('stroke-width',1.5).attr('opacity',0.85);
    svg.append('text').attr('x',cx).attr('y',H-m.b+18).attr('text-anchor','middle')
      .attr('fill',hue).attr('font-size',10).attr('font-weight',600).text(shortName(sub));
    svg.append('text').attr('x',cx).attr('y',H-m.b+30).attr('text-anchor','middle')
      .attr('fill',TOKENS.faint).attr('font-size',9).attr('font-family','ui-monospace')
      .text(st.meanRt.toFixed(2));
  });
  svg.append('text').attr('x',(x.range()[0]+x.range()[1])/2).attr('y',H-6)
    .attr('text-anchor','middle').attr('fill',TOKENS.muted).attr('font-size',11)
    .text(drugs.length===1
      ? `${shortName(drugs[0])} · retention time (min) — read down the column for batch drift`
      : 'retention time (min) — read down each drug column for batch variation');
}

function drawSampleIndex(svg,m,H,rows){
  svg.append('text').attr('x',m.l-8).attr('y',m.t+8).attr('text-anchor','end')
    .attr('fill',TOKENS.muted).attr('font-size',9).text('newest');
  const step=Math.max(1,Math.floor(rows.length/8));
  for(let i=0;i<rows.length;i+=step){
    const y=ySample(i,m,H,rows);
    svg.append('text').attr('x',m.l-8).attr('y',y+3).attr('text-anchor','end')
      .attr('fill',TOKENS.faint).attr('font-size',8).attr('font-family','ui-monospace')
      .text('#'+(rows.length-i));
  }
}


const stage=scaffold({
  tag:'Nº 06c · GC–MS',
  title:'Batch Ridgeline — Key Substance Focus',
  dek:'Pick fentanyl, heroin, meth, or cocaine — fifty sample traces zoom to that substance so batch drift reads without unrelated peak clutter.',
  how:`Select a <b>key substance</b> to filter and zoom. The view shows <b>50 newest samples</b> as thin traces in that substance's retention window, plus a single <b>variability column</b> for the chosen drug. The <b>snaking line</b> passes through that substance's peak apex on every sample row. Dots on the mean-RT vertical mark the ideal landing point. Below the stack, the <b>ideal reference</b> shows the mean curve for that substance. <b>Limits:</b> other substances in the same sample may be hidden outside the zoom window.`,
  provenance:'Each row synthesized from a plausible component mix over real retention times; illustrative of batch-consistency analysis.',
  harm:'Even a "consistent" supply shifts without warning. Test every time; potency can change while the fingerprint looks the same.'
});

stage.innerHTML=`
<style>
  #stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
  #stats b{color:var(--ink);font-family:ui-monospace,monospace;font-weight:600}
  #stats .tag{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style>
<div class="controls">
  ${keySubstanceControlsMarkup('fentanyl')}
  <span style="width:1px;height:24px;background:var(--line);margin:0 4px"></span>
  <button class="tgl" id="m1" aria-pressed="true">Stable market</button>
  <button class="tgl" id="m2" aria-pressed="false">Volatile period</button>
</div>
<div id="stats" aria-live="polite"></div>
<div class="panel"><svg id="svg" width="100%" height="760" role="img" aria-label="Key-substance fifty-sample ridgelines with variability column"></svg></div>`;

let mode='stable';
document.getElementById('m1').onclick=()=>setMode('stable');
document.getElementById('m2').onclick=()=>setMode('volatile');
const getKeySub=initKeySubstanceControls('fentanyl',()=>draw(false));

function setMode(m){
  mode=m;
  document.getElementById('m1').setAttribute('aria-pressed',m==='stable');
  document.getElementById('m2').setAttribute('aria-pressed',m==='volatile');
  draw(false);
}

function filterPeaks(peaks,substance){
  return peaks.filter(p=>p.s===substance);
}

function updateStats(rows,keyMeta,domain){
  const sub=keyMeta.substance;
  const present=rows.filter(peaks=>peaks.some(p=>p.s===sub)).length;
  const st=computeDrugStats(rows,sub);
  document.getElementById('stats').innerHTML=`
    <span><i class="tag" style="background:${drugHue(sub)}"></i><b>${keyMeta.label}</b> · key substance</span>
    <span>Present in <b>${present}</b> / ${rows.length} samples</span>
    <span>Mean RT <b>${st.meanRt.toFixed(2)}</b> <span class="muted">min</span></span>
    <span>RT spread <b>${(st.stdRt*2).toFixed(2)}</b> <span class="muted">min</span></span>
    <span>Window <b>${domain[0].toFixed(1)}–${domain[1].toFixed(1)}</b> <span class="muted">min</span></span>`;
}

function draw(animate){
  const svg=d3.select('#svg');
  const W=svg.node().clientWidth,H=760;
  const m=layout(H);
  const keyMeta=getKeySub();
  const sub=keyMeta.substance;
  const rows=sampleRows(mode,{classFilter:keyMeta.classFilter});
  const drugs=[sub];
  const domain=domainForSubstance(rows,sub);
  const band=sampleBand(H,m);

  svg.selectAll('*').remove();

  const x=d3.scaleLinear(domain,[m.l,W-m.r]);
  const overlap=2.1;
  const peakFilter=peaks=>filterPeaks(peaks,sub);

  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',band)
    .attr('fill','none').attr('stroke',drugHue(sub)).attr('stroke-width',1).attr('opacity',0.25);

  const plot=svg.append('g').attr('class','plot');
  rows.forEach((peaks,i)=>{
    const fPeaks=filterPeaks(peaks,sub);
    const y=rowYScale(i,m,H,rows,overlap);
    const trace=fPeaks.length?chromatogram(fPeaks,{x0:domain[0],x1:domain[1],sigma:0.05,n:140}):{x:[],y:[]};
    if(trace.y.length){
      plot.append('path').datum(trace.y)
        .attr('d',d3.line().x((d,k)=>x(trace.x[k])).y(d=>y(d)).curve(d3.curveBasis))
        .attr('fill','none').attr('stroke',drugHue(sub)).attr('stroke-width',0.65).attr('opacity',0.42);
    }else{
      plot.append('line').attr('x1',x(domain[0])).attr('x2',x(domain[1]))
        .attr('y1',ySample(i,m,H,rows)).attr('y2',ySample(i,m,H,rows))
        .attr('stroke',TOKENS.faint).attr('stroke-width',0.4).attr('opacity',0.35);
    }
  });

  drawVariabilityColumns(svg,{rows,drugs,x,m,H,domain,overlap,peakFilter});
  drawReferenceRow(svg,x,drugs,rows,domain[0],domain[1],m);

  drawDrugLabels(svg,drugs,rows,x,H,m);
  drawSampleIndex(svg,m,H,rows);
  updateStats(rows,keyMeta,domain);
}

draw(false);
window.__vizRedraw=()=>draw(false);
addEventListener('resize',()=>draw(false));

</script>
