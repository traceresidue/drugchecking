<script>
(function(){
/* Drug Checking Visualization Framework — shared helpers
   Loaded by every standalone visualization. Pure ES module, no dependencies.
   Provides: design tokens (CSS injection), substance classification + palette,
   spectral synthesis (Gaussian chromatograms, stick spectra, FTIR curves),
   formatting, tooltip, and a small DOM scaffold builder. */

const TOKENS = {
  bg:'#0b0e14', panel:'#121826', panel2:'#1a2234', line:'#26304a',
  ink:'#e8ecf4', muted:'#8b94a8', faint:'#5b6478',
  opioid:'#ff8a5c', fent:'#ff5c7a', xyl:'#b388ff', stim:'#ffd166',
  coke:'#4cc9f0', benzo:'#7aa2ff', cut:'#6ee7a8', other:'#94a3b8',
  alert:'#ff5c7a', watch:'#ffd166', ok:'#6ee7a8', info:'#4cc9f0'
};

/* Map a substance name -> {class, color, label, action} */
const CLASS = {
  fent:{color:TOKENS.fent,label:'Fentanyl & analogs'},
  opioid:{color:TOKENS.opioid,label:'Opioid'},
  xyl:{color:TOKENS.xyl,label:'Sedative / xylazine'},
  stim:{color:TOKENS.stim,label:'Stimulant'},
  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES) if(re.test(n)) return {cls:c,...CLASS[c]};
  return {cls:'other',...CLASS.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

/* ---- tooltip ---- */
let _tt;
function tooltip(){
  if(_tt) return _tt;
  _tt=document.createElement('div');
  _tt.style.cssText=`position:fixed;pointer-events:none;z-index:99;background:${TOKENS.panel2};border:1px solid ${TOKENS.line};border-radius:8px;padding:8px 10px;font:12px/1.4 Inter,system-ui;color:${TOKENS.ink};box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:260px`;
  document.body.appendChild(_tt);
  return {
    show(html,x,y){_tt.innerHTML=html;_tt.style.opacity=1;const r=_tt.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth)nx=x-r.width-14;if(ny+r.height>innerHeight)ny=y-r.height-14;_tt.style.left=nx+'px';_tt.style.top=ny+'px';},
    hide(){_tt.style.opacity=0;}
  };
}

/* ---- page scaffold + global CSS ---- */
function scaffold({tag,title,dek,how,provenance,harm}={}){
  injectCSS();
  document.body.innerHTML=`
    <header class="dcf-h">
      <div class="dcf-tag">${tag||''}</div>
      <h1>${title||''}</h1>
      <p class="dek">${dek||''}</p>
    </header>
    <main id="stage"></main>
    <details class="dcf-how"><summary>How to read this</summary><div>${how||''}</div></details>
    <footer class="dcf-f">
      <p class="prov">${provenance||''}</p>
      ${harm?`<p class="harm">${harm}</p>`:''}
    </footer>`;
  return document.getElementById('stage');
}
function injectCSS(){
  if(document.getElementById('dcf-css')) return;
  const s=document.createElement('style'); s.id='dcf-css';
  s.textContent=`
  :root{--bg:${TOKENS.bg};--panel:${TOKENS.panel};--panel2:${TOKENS.panel2};--line:${TOKENS.line};--ink:${TOKENS.ink};--muted:${TOKENS.muted};--faint:${TOKENS.faint}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",monospace}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .dcf-h{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .dcf-tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .dcf-h h1{font-size:27px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .dek{font-size:15px;line-height:1.5;color:var(--muted);margin:0;max-width:74ch}
  #stage{margin:18px 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .dcf-how{margin:22px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .dcf-how summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink);list-style:none}
  .dcf-how summary::before{content:"ⓘ ";color:var(--muted)}
  .dcf-how[open] summary{border-bottom:1px solid var(--line)}
  .dcf-how>div{padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .dcf-how b{color:var(--ink)}
  .dcf-f{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}
  .dcf-f .prov{color:var(--faint);margin:0 0 6px}
  .dcf-f .harm{color:var(--muted);margin:0;padding-left:11px;border-left:3px solid ${TOKENS.ok}}
  button.tgl{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:500 13px Inter;cursor:pointer;transition:.15s}
  button.tgl:hover{background:var(--panel2);color:var(--ink)}
  button.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=range]{accent-color:${TOKENS.info}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  `;
  document.head.appendChild(s);
}

/* draw a 2D structure from SMILES into a <canvas id=...>; needs SmilesDrawer loaded.
   Uses the dark theme tuned to the framework background. No-ops gracefully if absent. */
function drawSmiles(smiles,canvasId,w=160,h=120){
  const el=document.getElementById(canvasId);
  if(!el||typeof SmilesDrawer==='undefined'||!smiles){ if(el){const c=el.getContext&&el.getContext('2d');if(c){c.fillStyle='#5b6478';c.font='11px Inter';c.fillText('structure n/a',8,h/2);}} return; }
  try{
    const drawer=new SmilesDrawer.Drawer({width:w,height:h,padding:14,bondThickness:1.1,
      themes:{dcf:{C:'#cfd6e4',N:'#7aa2ff',O:'#ff8a5c',F:'#6ee7a8',S:'#ffd166',Cl:'#6ee7a8',Br:'#ff8a5c',
        BACKGROUND:'#0e1320',bond:'#9aa6bd',default:'#cfd6e4'}}});
    SmilesDrawer.parse(smiles,t=>drawer.draw(t,canvasId,'dcf',false),()=>{});
  }catch(e){}
}


window.DCF={TOKENS,classify,fmt,chromatogram,ftirCurve,stickSpectrum,cosine,tooltip,scaffold,injectCSS,drawSmiles};

})();
</script>
<script>
/* Nº 02 · Annotated Chromatogram Explorer — UNC's "visual fingerprint" made
   touchable. A synthesized GC–MS trace; tap any peak to reveal its mass spectrum,
   2D structure, plain-language drug card, and harm-reduction note. */
const {scaffold,chromatogram,stickSpectrum,classify,tooltip,fmt,TOKENS,drawSmiles}=DCF;
const CH=SPEC.chromatograms, MS=SPEC.ms, RT=Object.fromEntries(DATA.retention_times.map(d=>[d.substance,d.rt]));

const NOTE={
  fentanyl:'Potent synthetic opioid. Dominant peak ≠ known dose — small visual changes mean large potency changes.',
  '4-anpp':'A fentanyl precursor/impurity. Its presence is a chemical signature of fentanyl synthesis.',
  xylazine:'A veterinary sedative ("tranq"). Not an opioid — naloxone won\'t reverse its sedation, and it causes severe skin wounds.',
  acetaminophen:'A common cut (Tylenol). Inactive at these levels but signals a pressed or bulked product.',
  caffeine:'A stimulant cut that volatilises the mix for smoking and adds a rush.',
  lidocaine:'A local anesthetic cut that numbs — sometimes mistaken for "good" cocaine.',
  cocaine:'Stimulant. Watch for fentanyl cross-contamination in any powder supply.',
  heroin:'Classic opioid; increasingly displaced by fentanyl in the unregulated supply.',
  'p-fluorofentanyl':'A fentanyl analog that rides alongside fentanyl; adds to total opioid load.',
  diphenhydramine:'An antihistamine (Benadryl) cut that deepens sedation.',
  bromazolam:'A street benzodiazepine. Combined with opioids it deepens and prolongs overdose; naloxone won\'t fix the benzo part.',
  benzocaine:'Anesthetic cut mimicking cocaine\'s numbing.',
  levamisole:'A veterinary dewormer cut in cocaine; can damage white blood cells and skin.',
  'dimethyl sulfone':'An inert bulking agent (MSM) common in methamphetamine.',
  'n,n-dimethylamphetamine':'A methamphetamine synthesis byproduct.',
  benzoylecgonine:'A cocaine breakdown product — a fingerprint of cocaine itself.'
};

const stage=scaffold({
  tag:'Nº 02 · GC–MS',
  title:'Annotated Chromatogram Explorer',
  dek:'A GC–MS chromatogram is a sample\'s visual fingerprint. Each peak is one substance, separated by how fast it travels through the instrument. Tap a peak to learn what it is.',
  how:`<b>Reading the trace.</b> The x-axis is <b>retention time</b> — how long a compound takes to pass through the column (a fixed property, like a fingerprint). The y-axis is <b>relative abundance</b>. <b>More peaks = more substances. Taller peaks = more signal, NOT higher purity or dose.</b> Different compounds ionise with wildly different efficiency, so a tall peak and a short peak can be present in similar amounts. <b>Tap any peak</b> to see its mass spectrum, structure, and a plain-language card.`,
  provenance:'Trace synthesized from real median GC–MS retention times in this dataset; mass spectra illustrative.',
  harm:'Carry naloxone and test strips. A clean-looking fingerprint can still hide a fatal dose — height shows signal, not strength.'
});

stage.innerHTML=`
<div class="controls">
  <label class="muted" style="font-size:13px">Sample archetype</label>
  <select id="arch"></select>
</div>
<div class="panel"><svg id="svg" width="100%" height="340" role="img" aria-label="Interactive GC-MS chromatogram"></svg></div>
<div id="detail" class="panel" style="margin-top:14px;min-height:170px"></div>`;

const archSel=document.getElementById('arch');
for(const k of Object.keys(CH)) archSel.add(new Option(CH[k].label,k));
archSel.style.cssText='background:#1a2234;color:#e8ecf4;border:1px solid #26304a;border-radius:8px;padding:7px 10px;font:500 13px Inter';
const tt=tooltip();
let selected=null;
archSel.onchange=()=>{selected=null;draw();};

function peaksFor(key){
  return CH[key].peaks.map(([s,rt,amp])=>({s,rt:RT[s]||rt,amp,sigma:0.05}));
}

function draw(){
  const svg=d3.select('#svg'); svg.selectAll('*').remove();
  const W=svg.node().clientWidth,H=340,m={t:20,r:16,b:40,l:46};
  const peaks=peaksFor(archSel.value);
  const trace=chromatogram(peaks,{x0:3,x1:13,sigma:0.05});
  const x=d3.scaleLinear([3,13],[m.l,W-m.r]);
  const y=d3.scaleLinear([0,105],[H-m.b,m.t]);
  // grid
  x.ticks(10).forEach(t=>svg.append('text').attr('x',x(t)).attr('y',H-14).attr('fill',TOKENS.faint).attr('font-size',11).attr('text-anchor','middle').attr('font-family','ui-monospace').text(t));
  svg.append('text').attr('x',(W)/2).attr('y',H-2).attr('text-anchor','middle').attr('fill',TOKENS.muted).attr('font-size',11).text('retention time (minutes)');
  svg.append('text').attr('transform',`translate(13,${H/2})rotate(-90)`).attr('text-anchor','middle').attr('fill',TOKENS.muted).attr('font-size',11).text('relative abundance');
  // area
  const area=d3.area().x((d,i)=>x(trace.x[i])).y0(y(0)).y1(d=>y(d)).curve(d3.curveBasis);
  const grad=svg.append('defs').append('linearGradient').attr('id','g').attr('x1',0).attr('x2',0).attr('y1',0).attr('y2',1);
  grad.append('stop').attr('offset','0%').attr('stop-color',TOKENS.info).attr('stop-opacity',.5);
  grad.append('stop').attr('offset','100%').attr('stop-color',TOKENS.info).attr('stop-opacity',.04);
  svg.append('path').datum(trace.y).attr('d',area).attr('fill','url(#g)');
  svg.append('path').datum(trace.y).attr('d',d3.line().x((d,i)=>x(trace.x[i])).y(d=>y(d)).curve(d3.curveBasis)).attr('fill','none').attr('stroke',TOKENS.info).attr('stroke-width',1.6);
  // peak hotspots + labels
  peaks.forEach(p=>{
    const col=classify(p.s).color;
    const px=x(p.rt), py=y(p.amp);
    svg.append('circle').attr('cx',px).attr('cy',py-4).attr('r',selected===p.s?7:5).attr('fill',col).attr('stroke',TOKENS.bg).attr('stroke-width',2).style('cursor','pointer')
      .on('mousemove',e=>tt.show(`<b>${p.s}</b><br><span class="muted mono">RT ${fmt.rt(p.rt)} min</span>`,e.clientX,e.clientY))
      .on('mouseleave',tt.hide)
      .on('click',()=>{selected=p.s;draw();showDetail(p.s);});
    if(p.amp>14||selected===p.s)
      svg.append('text').attr('x',px).attr('y',py-12).attr('text-anchor','middle').attr('font-size',10).attr('font-family','ui-monospace').attr('fill',selected===p.s?col:TOKENS.muted).text(p.s.length>12?p.s.slice(0,11)+'…':p.s);
  });
  if(!selected) document.getElementById('detail').innerHTML=`<div class="muted" style="display:flex;height:140px;align-items:center;justify-content:center;font-size:14px">▲ Tap a peak to identify the substance</div>`;
}

function showDetail(s){
  const d=document.getElementById('detail'); const c=classify(s);
  const ms=MS[s];
  d.innerHTML=`
   <div style="display:grid;grid-template-columns:1fr 200px 160px;gap:18px;align-items:start">
     <div>
       <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
         <span style="width:12px;height:12px;border-radius:3px;background:${c.color};display:inline-block"></span>
         <span style="font-size:18px;font-weight:700;text-transform:capitalize">${s}</span>
         <span class="muted" style="font-size:12px">${c.label}</span>
       </div>
       <p class="muted" style="font-size:13.5px;line-height:1.55;margin:0;max-width:52ch">${NOTE[s]||'Detected component. Tap other peaks to compare.'}</p>
     </div>
     <div><div class="muted" style="font-size:11px;margin-bottom:4px">MASS SPECTRUM</div><svg id="ms" width="200" height="120"></svg></div>
     <div><div class="muted" style="font-size:11px;margin-bottom:4px">STRUCTURE</div><canvas id="mol" width="160" height="120" style="background:#0e1320;border-radius:8px"></canvas></div>
   </div>`;
  if(ms){
    const svg=d3.select('#ms'); const pk=stickSpectrum(ms.peaks);
    const x=d3.scaleLinear(d3.extent(pk,p=>p.mz),[6,194]), y=d3.scaleLinear([0,100],[112,8]);
    svg.selectAll('line').data(pk).join('line').attr('x1',p=>x(p.mz)).attr('x2',p=>x(p.mz)).attr('y1',112).attr('y2',p=>y(p.i)).attr('stroke',c.color).attr('stroke-width',1.4);
    svg.append('text').attr('x',6).attr('y',118).attr('fill',TOKENS.faint).attr('font-size',9).attr('font-family','ui-monospace').text('m/z');
    drawSmiles(ms.smiles,'mol',160,120);
  } else {
    document.getElementById('ms').outerHTML='<div class="faint" style="font-size:11px;width:200px">spectrum n/a</div>';
  }
}
draw();
addEventListener('resize',()=>{draw();if(selected)showDetail(selected);});

</script>
</body>
</html>
