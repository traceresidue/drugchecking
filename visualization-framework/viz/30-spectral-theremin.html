<script>
(function(){
/* Drug Checking Visualization Framework — shared helpers
   Loaded by every standalone visualization. Pure ES module, no dependencies.
   Provides: design tokens (CSS injection), substance classification + palette,
   spectral synthesis (Gaussian chromatograms, stick spectra, FTIR curves),
   formatting, tooltip, and a small DOM scaffold builder. */

const TOKENS = {
  bg:'#0b0e14', panel:'#121826', panel2:'#1a2234', line:'#26304a',
  ink:'#e8ecf4', muted:'#8b94a8', faint:'#5b6478',
  opioid:'#ff8a5c', fent:'#ff5c7a', xyl:'#b388ff', stim:'#ffd166',
  coke:'#4cc9f0', benzo:'#7aa2ff', cut:'#6ee7a8', other:'#94a3b8',
  alert:'#ff5c7a', watch:'#ffd166', ok:'#6ee7a8', info:'#4cc9f0'
};

/* Map a substance name -> {class, color, label, action} */
const CLASS = {
  fent:{color:TOKENS.fent,label:'Fentanyl & analogs'},
  opioid:{color:TOKENS.opioid,label:'Opioid'},
  xyl:{color:TOKENS.xyl,label:'Sedative / xylazine'},
  stim:{color:TOKENS.stim,label:'Stimulant'},
  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES) if(re.test(n)) return {cls:c,...CLASS[c]};
  return {cls:'other',...CLASS.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

/* ---- tooltip ---- */
let _tt;
function tooltip(){
  if(_tt) return _tt;
  _tt=document.createElement('div');
  _tt.style.cssText=`position:fixed;pointer-events:none;z-index:99;background:${TOKENS.panel2};border:1px solid ${TOKENS.line};border-radius:8px;padding:8px 10px;font:12px/1.4 Inter,system-ui;color:${TOKENS.ink};box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:260px`;
  document.body.appendChild(_tt);
  return {
    show(html,x,y){_tt.innerHTML=html;_tt.style.opacity=1;const r=_tt.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth)nx=x-r.width-14;if(ny+r.height>innerHeight)ny=y-r.height-14;_tt.style.left=nx+'px';_tt.style.top=ny+'px';},
    hide(){_tt.style.opacity=0;}
  };
}

/* ---- page scaffold + global CSS ---- */
function scaffold({tag,title,dek,how,provenance,harm}={}){
  injectCSS();
  document.body.innerHTML=`
    <header class="dcf-h">
      <div class="dcf-tag">${tag||''}</div>
      <h1>${title||''}</h1>
      <p class="dek">${dek||''}</p>
    </header>
    <main id="stage"></main>
    <details class="dcf-how"><summary>How to read this</summary><div>${how||''}</div></details>
    <footer class="dcf-f">
      <p class="prov">${provenance||''}</p>
      ${harm?`<p class="harm">${harm}</p>`:''}
    </footer>`;
  return document.getElementById('stage');
}
function injectCSS(){
  if(document.getElementById('dcf-css')) return;
  const s=document.createElement('style'); s.id='dcf-css';
  s.textContent=`
  :root{--bg:${TOKENS.bg};--panel:${TOKENS.panel};--panel2:${TOKENS.panel2};--line:${TOKENS.line};--ink:${TOKENS.ink};--muted:${TOKENS.muted};--faint:${TOKENS.faint}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",monospace}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .dcf-h{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .dcf-tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .dcf-h h1{font-size:27px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .dek{font-size:15px;line-height:1.5;color:var(--muted);margin:0;max-width:74ch}
  #stage{margin:18px 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .dcf-how{margin:22px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .dcf-how summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink);list-style:none}
  .dcf-how summary::before{content:"ⓘ ";color:var(--muted)}
  .dcf-how[open] summary{border-bottom:1px solid var(--line)}
  .dcf-how>div{padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .dcf-how b{color:var(--ink)}
  .dcf-f{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}
  .dcf-f .prov{color:var(--faint);margin:0 0 6px}
  .dcf-f .harm{color:var(--muted);margin:0;padding-left:11px;border-left:3px solid ${TOKENS.ok}}
  button.tgl{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:500 13px Inter;cursor:pointer;transition:.15s}
  button.tgl:hover{background:var(--panel2);color:var(--ink)}
  button.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=range]{accent-color:${TOKENS.info}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  `;
  document.head.appendChild(s);
}

/* draw a 2D structure from SMILES into a <canvas id=...>; needs SmilesDrawer loaded.
   Uses the dark theme tuned to the framework background. No-ops gracefully if absent. */
function drawSmiles(smiles,canvasId,w=160,h=120){
  const el=document.getElementById(canvasId);
  if(!el||typeof SmilesDrawer==='undefined'||!smiles){ if(el){const c=el.getContext&&el.getContext('2d');if(c){c.fillStyle='#5b6478';c.font='11px Inter';c.fillText('structure n/a',8,h/2);}} return; }
  try{
    const drawer=new SmilesDrawer.Drawer({width:w,height:h,padding:14,bondThickness:1.1,
      themes:{dcf:{C:'#cfd6e4',N:'#7aa2ff',O:'#ff8a5c',F:'#6ee7a8',S:'#ffd166',Cl:'#6ee7a8',Br:'#ff8a5c',
        BACKGROUND:'#0e1320',bond:'#9aa6bd',default:'#cfd6e4'}}});
    SmilesDrawer.parse(smiles,t=>drawer.draw(t,canvasId,'dcf',false),()=>{});
  }catch(e){}
}


window.DCF={TOKENS,classify,fmt,chromatogram,ftirCurve,stickSpectrum,cosine,tooltip,scaffold,injectCSS,drawSmiles};

})();
</script>
<script>
/* Nº 30 · Spectral Theremin — hover or drag across a GC–MS chromatogram to hear
   it. Each peak becomes a note: pitch = retention time mapped to a musical scale,
   volume envelope = peak intensity. Moving the mouse across the trace "plays"
   the spectrum like a Theremin. Two modes: hover-scan (continuous drone) and
   step (peaks as discrete notes). An experimental multisensory approach. */
const {scaffold,classify,fmt,tooltip,TOKENS,chromatogram}=DCF;
const RT=DATA.retention_times;
const PROFILES={
  'fentanyl street':['fentanyl','4-anpp','xylazine','acetaminophen','caffeine','p-fluorofentanyl'],
  'meth':['methamphetamine','caffeine','dimethyl sulfone (methylsulfonylmethane msm)'],
  'cocaine':['cocaine','levamisole','caffeine','lidocaine'],
};
const rtMap=Object.fromEntries(RT.map(d=>[d.substance,d.rt]));
const extraRT={caffeine:8.12,'4-anpp':9.6,xylazine:7.9,acetaminophen:5.44,'p-fluorofentanyl':10.84,lidocaine:7.26,levamisole:7.8,'dimethyl sulfone (methylsulfonylmethane msm)':3.2};

const stage=scaffold({
  tag:'Nº 30 · SONIC',
  title:'Spectral Theremin',
  dek:'Hover across the chromatogram to hear each peak as a note. Retention time → pitch, peak height → volume. A multisensory way to "feel" a spectrum — and notice which peaks dominate.',
  how:`Move your cursor slowly across the <b>chromatogram panel</b> to hear the spectrum. Your horizontal position controls which retention time you are "at" (mapped to a musical scale: low RT = low pitch, high RT = high pitch). The current signal amplitude at that RT controls the volume. <b>Peaks play louder</b>, valleys are nearly silent. Switch between <b>drone mode</b> (continuous tone following your mouse) and <b>step mode</b> (peaks trigger discrete notes). Select a different supply profile to hear how the melody changes. This is an <b>accessibility concept</b>: spectra as a tactile/auditory experience, not just visual.`,
  provenance:'Chromatogram synthesized from real retention times; composition based on common supply profiles.',
  harm:'Each peak is a substance — even the quiet ones matter. The tallest peak is not necessarily the most dangerous one by dose.'
});

stage.innerHTML=`
<div class="controls">
  <label class="muted" style="font-size:13px">Profile:</label>
  <select id="profile" style="background:#1a2234;color:#e8ecf4;border:1px solid #26304a;border-radius:8px;padding:7px 10px;font-size:13px"></select>
  <button class="tgl" id="modeBtn" aria-pressed="false">drone mode</button>
  <button class="tgl" id="playPeaks">▶ play peaks</button>
  <span id="note" class="mono" style="font-size:13px;min-width:8ch"></span>
</div>
<div class="panel" id="svgWrap" style="cursor:crosshair">
  <svg id="svg" width="100%" height="340" role="img" aria-label="Interactive chromatogram theremin"></svg>
</div>
<div id="cursor-line" style="display:none"></div>`;

const profileSel=document.getElementById('profile');
Object.keys(PROFILES).forEach(k=>{profileSel.add(new Option(k,k));});
profileSel.value='fentanyl street';

const tt=tooltip();
let ctx=null, osc=null, gainNode=null, droneActive=false, droneMode=false;

function getCtx(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();}return ctx;}

function buildPeaks(profileKey){
  const subs=PROFILES[profileKey];
  const amps={
    fentanyl:1,xylazine:.75,'4-anpp':.85,'p-fluorofentanyl':.45,acetaminophen:.6,caffeine:.55,
    methamphetamine:.9,'dimethyl sulfone (methylsulfonylmethane msm)':.35,
    cocaine:.88,levamisole:.4,lidocaine:.3,heroin:.7
  };
  return subs.map(s=>({s,rt:rtMap[s]||extraRT[s]||8,amp:(amps[s]||.5)*100,sigma:.055})).filter(p=>p.rt);
}

// Map RT (3–13 min) to musical note frequencies (C3–C6)
const C3=130.81, SEMITONE=Math.pow(2,1/12);
function rtToFreq(rt){
  const norm=(rt-3)/(13-3); // 0–1
  const semitones=Math.round(norm*36); // 3 octaves
  return C3*Math.pow(SEMITONE,semitones);
}

let currentPeaks=[], currentTrace=null;
const m={t:20,r:16,b:36,l:48};
let W=800,H=340;

function drawChart(){
  const svg=d3.select('#svg'); svg.selectAll('*').remove();
  W=svg.node().clientWidth||800; H=340;
  currentPeaks=buildPeaks(profileSel.value);
  currentTrace=chromatogram(currentPeaks,{x0:3,x1:13,n:200,sigma:.055});
  const x=d3.scaleLinear([3,13],[m.l,W-m.r]);
  const y=d3.scaleLinear([0,100],[H-m.b,m.t]);
  // grid
  [0,25,50,75,100].forEach(v=>{
    svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(v)).attr('y2',y(v)).attr('stroke',TOKENS.line).attr('opacity',.25);
  });
  x.ticks(10).forEach(t=>{
    svg.append('text').attr('x',x(t)).attr('y',H-14).attr('text-anchor','middle').attr('fill',TOKENS.faint).attr('font-size',10).attr('font-family','ui-monospace').text(t);
  });
  svg.append('text').attr('x',W/2).attr('y',H-2).attr('text-anchor','middle').attr('fill',TOKENS.muted).attr('font-size',10).text('retention time (min) — hover to play');
  // area
  const dom=classify(currentPeaks.sort((a,b)=>b.amp-a.amp)[0].s).color;
  const area=d3.area().x((d,i)=>x(currentTrace.x[i])).y0(y(0)).y1(d=>y(d)).curve(d3.curveBasis);
  svg.append('path').datum(currentTrace.y).attr('d',area).attr('fill',dom).attr('opacity',.12);
  svg.append('path').datum(currentTrace.y).attr('d',d3.line().x((d,i)=>x(currentTrace.x[i])).y(d=>y(d)).curve(d3.curveBasis)).attr('fill','none').attr('stroke',dom).attr('stroke-width',2);
  // peak labels
  currentPeaks.sort((a,b)=>b.amp-a.amp).forEach(p=>{
    const c=classify(p.s);
    svg.append('circle').attr('cx',x(p.rt)).attr('cy',y(p.amp)-2).attr('r',5).attr('fill',c.color).attr('stroke',TOKENS.bg).attr('stroke-width',1.5);
    svg.append('text').attr('x',x(p.rt)).attr('y',y(p.amp)-12).attr('text-anchor','middle').attr('font-size',10).attr('font-family','ui-monospace').attr('fill',c.color).text(p.s.length>12?p.s.slice(0,11)+'…':p.s);
  });
  // Cursor highlight (vertical line overlay, drawn on hover)
  svg.append('line').attr('id','cline').attr('x1',0).attr('x2',0).attr('y1',m.t).attr('y2',H-m.b).attr('stroke',TOKENS.ok).attr('stroke-width',1.5).attr('opacity',0);
}

// Hover handler
const svgWrap=document.getElementById('svgWrap');
let lastRt=null;
svgWrap.addEventListener('mousemove',e=>{
  if(!currentTrace) return;
  const rect=svgWrap.getBoundingClientRect();
  const px=(e.clientX-rect.left);
  const rt=3+(px-m.l)/(W-m.l-m.r)*10;
  if(rt<3||rt>13) return;
  lastRt=rt;
  // interpolate amplitude at this RT
  const idx=Math.round((rt-3)/(13-3)*(currentTrace.x.length-1));
  const amp=currentTrace.y[Math.max(0,Math.min(idx,currentTrace.y.length-1))]||0;
  // cursor line
  d3.select('#cline').attr('x1',m.l+(rt-3)/(13-3)*(W-m.l-m.r)).attr('x2',m.l+(rt-3)/(13-3)*(W-m.l-m.r)).attr('opacity',.7);
  // audio: drone mode
  if(droneMode){
    const ac=getCtx(); if(ac.state==='suspended') ac.resume();
    const freq=rtToFreq(rt);
    const vol=(amp/100)*0.35;
    if(!osc){
      gainNode=ac.createGain(); gainNode.gain.value=0; gainNode.connect(ac.destination);
      osc=ac.createOscillator(); osc.type='sine'; osc.connect(gainNode); osc.start();
    }
    osc.frequency.exponentialRampToValueAtTime(Math.max(freq,20),ac.currentTime+0.03);
    gainNode.gain.linearRampToValueAtTime(vol,ac.currentTime+0.03);
    droneActive=true;
  }
  // closest peak label
  const closest=currentPeaks.reduce((best,p)=>(Math.abs(p.rt-rt)<Math.abs(best.rt-rt)?p:best),currentPeaks[0]);
  if(Math.abs(closest.rt-rt)<0.4){
    const c=classify(closest.s);
    document.getElementById('note').textContent=`♪ ${closest.s.split(' ')[0]}`;
    document.getElementById('note').style.color=c.color;
  } else {
    document.getElementById('note').textContent=`${rt.toFixed(1)} min`;
    document.getElementById('note').style.color=TOKENS.muted;
  }
});
svgWrap.addEventListener('mouseleave',()=>{
  if(gainNode&&droneActive){gainNode.gain.linearRampToValueAtTime(0,getCtx().currentTime+0.1);droneActive=false;}
  d3.select('#cline').attr('opacity',0);
});

document.getElementById('modeBtn').onclick=function(){
  droneMode=!droneMode;this.textContent=droneMode?'step mode':'drone mode';this.setAttribute('aria-pressed',droneMode);
  if(!droneMode&&osc){gainNode.gain.linearRampToValueAtTime(0,getCtx().currentTime+0.1);setTimeout(()=>{if(osc){osc.stop();osc=null;gainNode=null;}},200);}
};

document.getElementById('playPeaks').onclick=function(){
  const ac=getCtx(); if(ac.state==='suspended') ac.resume();
  const sorted=[...currentPeaks].sort((a,b)=>a.rt-b.rt);
  sorted.forEach((p,i)=>{
    const t=ac.currentTime+i*0.55;
    const freq=rtToFreq(p.rt);
    const vol=p.amp/100*0.4;
    const o=ac.createOscillator(); const g=ac.createGain();
    o.type=classify(p.s).cls==='stim'?'triangle':'sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.5);
  });
};

profileSel.onchange=drawChart;
drawChart();
addEventListener('resize',drawChart);

</script>
</body>
