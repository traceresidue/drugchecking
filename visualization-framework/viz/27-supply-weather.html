  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES) if(re.test(n)) return {cls:c,...CLASS[c]};
  return {cls:'other',...CLASS.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

/* ---- tooltip ---- */
let _tt;
function tooltip(){
  if(_tt) return _tt;
  _tt=document.createElement('div');
  _tt.style.cssText=`position:fixed;pointer-events:none;z-index:99;background:${TOKENS.panel2};border:1px solid ${TOKENS.line};border-radius:8px;padding:8px 10px;font:12px/1.4 Inter,system-ui;color:${TOKENS.ink};box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:260px`;
  document.body.appendChild(_tt);
  return {
    show(html,x,y){_tt.innerHTML=html;_tt.style.opacity=1;const r=_tt.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth)nx=x-r.width-14;if(ny+r.height>innerHeight)ny=y-r.height-14;_tt.style.left=nx+'px';_tt.style.top=ny+'px';},
    hide(){_tt.style.opacity=0;}
  };
}

/* ---- page scaffold + global CSS ---- */
function scaffold({tag,title,dek,how,provenance,harm}={}){
  injectCSS();
  document.body.innerHTML=`
    <header class="dcf-h">
      <div class="dcf-tag">${tag||''}</div>
      <h1>${title||''}</h1>
      <p class="dek">${dek||''}</p>
    </header>
    <main id="stage"></main>
    <details class="dcf-how"><summary>How to read this</summary><div>${how||''}</div></details>
    <footer class="dcf-f">
      <p class="prov">${provenance||''}</p>
      ${harm?`<p class="harm">${harm}</p>`:''}
    </footer>`;
  return document.getElementById('stage');
}
function injectCSS(){
  if(document.getElementById('dcf-css')) return;
  const s=document.createElement('style'); s.id='dcf-css';
  s.textContent=`
  :root{--bg:${TOKENS.bg};--panel:${TOKENS.panel};--panel2:${TOKENS.panel2};--line:${TOKENS.line};--ink:${TOKENS.ink};--muted:${TOKENS.muted};--faint:${TOKENS.faint}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",monospace}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .dcf-h{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .dcf-tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .dcf-h h1{font-size:27px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .dek{font-size:15px;line-height:1.5;color:var(--muted);margin:0;max-width:74ch}
  #stage{margin:18px 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .dcf-how{margin:22px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .dcf-how summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink);list-style:none}
  .dcf-how summary::before{content:"ⓘ ";color:var(--muted)}
  .dcf-how[open] summary{border-bottom:1px solid var(--line)}
  .dcf-how>div{padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .dcf-how b{color:var(--ink)}
  .dcf-f{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}
  .dcf-f .prov{color:var(--faint);margin:0 0 6px}
  .dcf-f .harm{color:var(--muted);margin:0;padding-left:11px;border-left:3px solid ${TOKENS.ok}}
  button.tgl{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:500 13px Inter;cursor:pointer;transition:.15s}
  button.tgl:hover{background:var(--panel2);color:var(--ink)}
  button.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=range]{accent-color:${TOKENS.info}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  `;
  document.head.appendChild(s);
}

/* draw a 2D structure from SMILES into a <canvas id=...>; needs SmilesDrawer loaded.
   Uses the dark theme tuned to the framework background. No-ops gracefully if absent. */
function drawSmiles(smiles,canvasId,w=160,h=120){
  const el=document.getElementById(canvasId);
  if(!el||typeof SmilesDrawer==='undefined'||!smiles){ if(el){const c=el.getContext&&el.getContext('2d');if(c){c.fillStyle='#5b6478';c.font='11px Inter';c.fillText('structure n/a',8,h/2);}} return; }
  try{
    const drawer=new SmilesDrawer.Drawer({width:w,height:h,padding:14,bondThickness:1.1,
      themes:{dcf:{C:'#cfd6e4',N:'#7aa2ff',O:'#ff8a5c',F:'#6ee7a8',S:'#ffd166',Cl:'#6ee7a8',Br:'#ff8a5c',
        BACKGROUND:'#0e1320',bond:'#9aa6bd',default:'#cfd6e4'}}});
    SmilesDrawer.parse(smiles,t=>drawer.draw(t,canvasId,'dcf',false),()=>{});
  }catch(e){}
}


window.DCF={TOKENS,classify,fmt,chromatogram,ftirCurve,stickSpectrum,cosine,tooltip,scaffold,injectCSS,drawSmiles};

})();
</script>
<script>
/* Nº 27 · Supply Weather Report — the most recent month's supply composition
   expressed as a weather metaphor: a risk index, "conditions" (fentanyl %, xylazine %,
   novel substance alerts), and a 3-month outlook sparkline. A public-facing
   one-glance risk communication format. */
const {scaffold,classify,fmt,tooltip,TOKENS}=DCF;
const MC=DATA.monthly_class, MN=DATA.monthly;

const stage=scaffold({
  tag:'Nº 27 · EXPERIMENTAL',
  title:'Supply Weather Report',
  dek:'What\'s the current "weather" in the local drug supply? A risk index, current conditions, and a 3-month outlook — styled for the person who checks the forecast before they use.',
  how:`This adapts the <b>weather forecast</b> metaphor for drug supply risk communication. The <b>risk index</b> (0–10) is a composite of fentanyl positivity, xylazine prevalence, and mixture complexity in the most recent tested month. <b>Conditions</b> show the key current hazards. The <b>outlook sparkline</b> shows how the index trended over the past 6 months. This is <i>not</i> a real-time system — it reflects testing data from the most recent month in the dataset. <b>Concept:</b> the format is deliberately legible for people with limited health literacy; a weather app is universally understood.`,
  provenance:'Risk index calculated from real monthly supply composition data (6,580-sample dataset). Most recent month shown.',
  harm:'Like real weather, risk varies day-to-day and batch-to-batch. Always test, always carry naloxone, never use alone — even on a "low risk" day.'
});

// Get latest month
const months=[...new Set(MC.map(d=>d.month))].sort();
const latestMonth=months[months.length-1];

// Calculate a risk index for each month (0–10 scale)
function calcRisk(month){
  const rows=MC.filter(d=>d.month===month);
  const total=rows.reduce((a,b)=>a+b.n,0)||1;
  const fentN=(rows.find(d=>d.cls==='fent')||{n:0}).n;
  const xylN=(rows.find(d=>d.cls==='xyl')||{n:0}).n;
  const otherN=(rows.find(d=>d.cls==='other')||{n:0}).n;
  const benzoN=(rows.find(d=>d.cls==='benzo')||{n:0}).n;
  const fentPct=fentN/total, xylPct=xylN/total, novelPct=(otherN+benzoN)/total;
  // weighted risk
  return Math.min(10,(fentPct*5 + xylPct*3.5 + novelPct*1.5)*10);
}

const riskHistory=months.slice(-7).map(m=>({m,r:calcRisk(m)}));
const currentRisk=riskHistory[riskHistory.length-1]?.r||5;

// Current conditions
const latestRows=MC.filter(d=>d.month===latestMonth);
const totalLast=latestRows.reduce((a,b)=>a+b.n,0)||1;
function classShare(cls){return (latestRows.find(d=>d.cls===cls)||{n:0}).n/totalLast;}
const fentPct=classShare('fent'), xylPct=classShare('xyl'), benzoPct=classShare('benzo'), otherPct=classShare('other');

// Top new substances this month
const topMonthSubs=MN.filter(d=>d.month===latestMonth).sort((a,b)=>b.n-a.n).slice(0,5);

function riskLabel(r){
  if(r<3)return{icon:'🌤',label:'Low',color:TOKENS.ok,advice:'Lower volatility, but the supply still contains fentanyl. Test every time.'};
  if(r<5.5)return{icon:'⛅',label:'Moderate',color:TOKENS.watch,advice:'Significant fentanyl present. Never use alone. Have naloxone.'};
  if(r<7.5)return{icon:'🌩',label:'High',color:TOKENS.alert,advice:'High fentanyl + xylazine. Multiple doses of naloxone needed. 911 on standby.'};
  return{icon:'🌪',label:'Extreme',color:TOKENS.alert,advice:'Severe mixture complexity. Naloxone may not be enough alone — call 911 immediately if overdose.'};
}
const {icon,label,color,advice}=riskLabel(currentRisk);

stage.innerHTML=`
<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:18px">
  <div class="panel" style="text-align:center;padding:28px 18px">
    <div style="font-size:72px;line-height:1;margin-bottom:12px" role="img" aria-label="risk weather icon">${icon}</div>
    <div style="font:700 48px ui-monospace;color:${color}">${currentRisk.toFixed(1)}<span style="font-size:22px;color:${TOKENS.muted}">/10</span></div>
    <div style="font-size:22px;font-weight:700;color:${color};margin:6px 0">${label} Risk</div>
    <div class="muted" style="font-size:12px;margin-top:4px">${fmt.month(latestMonth)} · most recent data</div>
    <div style="margin-top:16px;padding:12px;background:#0b0e14;border-radius:10px;font-size:13px;line-height:1.5;color:${TOKENS.ink};text-align:left">${advice}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="panel">
      <div class="muted" style="font-size:11px;letter-spacing:.12em;margin-bottom:12px">CURRENT CONDITIONS · ${fmt.month(latestMonth)}</div>
      <div id="conditions"></div>
    </div>
    <div class="panel">
      <div class="muted" style="font-size:11px;letter-spacing:.12em;margin-bottom:6px">6-MONTH RISK TREND</div>
      <svg id="spark" width="100%" height="90"></svg>
    </div>
  </div>
</div>
<div class="panel" style="margin-top:14px">
  <div class="muted" style="font-size:11px;letter-spacing:.12em;margin-bottom:10px">MOST DETECTED THIS MONTH</div>
  <div id="topSubs" style="display:flex;gap:10px;flex-wrap:wrap"></div>
</div>`;

// Conditions panel
const conditions=[
  {label:'Fentanyl',pct:fentPct,color:TOKENS.fent,icon:'⚠️',note:fentPct>0.5?'Very high prevalence':'Present in supply'},
  {label:'Xylazine',pct:xylPct,color:TOKENS.xyl,icon:'🩹',note:xylPct>0.3?'High — wounds + deep sedation risk':'Detected; rescue breathing needed'},
  {label:'Benzodiazepines',pct:benzoPct,color:TOKENS.benzo,icon:'💊',note:'Prolongs sedation; naloxone doesn\'t reverse'},
  {label:'Unclassified / Novel',pct:otherPct,color:TOKENS.other,icon:'🔬',note:'Unknown potency — maximum caution'},
];
const condEl=document.getElementById('conditions');
conditions.forEach(c=>{
  const div=document.createElement('div');
  div.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px';
  const pctBar=Math.round(c.pct*100);
  div.innerHTML=`<div style="font-size:20px">${c.icon}</div>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-weight:600;font-size:13px;color:${c.color}">${c.label}</span>
        <span style="font-family:ui-monospace;font-size:12px;color:${c.color}">${pctBar}%</span>
      </div>
      <div style="background:#1a2234;border-radius:4px;height:6px">
        <div style="background:${c.color};height:6px;border-radius:4px;width:${pctBar}%;transition:.4s ease"></div>
      </div>
      <div style="font-size:11px;color:${TOKENS.muted};margin-top:3px">${c.note}</div>
    </div>`;
  condEl.appendChild(div);
});

// Sparkline
function drawSpark(){
  const svg=d3.select('#spark'); svg.selectAll('*').remove();
  const W=svg.node().clientWidth||300,H=90,m={t:10,r:8,b:24,l:8};
  const x=d3.scalePoint(riskHistory.map(d=>d.m),[m.l,W-m.r]);
  const y=d3.scaleLinear([0,10],[H-m.b,m.t]);
  const area=d3.area().x(d=>x(d.m)).y0(H-m.b).y1(d=>y(d.r)).curve(d3.curveCatmullRom);
  const line=d3.line().x(d=>x(d.m)).y(d=>y(d.r)).curve(d3.curveCatmullRom);
  svg.append('path').datum(riskHistory).attr('d',area).attr('fill',color).attr('opacity',.18);
  svg.append('path').datum(riskHistory).attr('d',line).attr('fill','none').attr('stroke',color).attr('stroke-width',2);
  riskHistory.forEach(d=>{
    svg.append('circle').attr('cx',x(d.m)).attr('cy',y(d.r)).attr('r',3).attr('fill',d.m===latestMonth?color:TOKENS.muted);
    svg.append('text').attr('x',x(d.m)).attr('y',H-8).attr('text-anchor','middle').attr('font-size',9).attr('font-family','ui-monospace').attr('fill',TOKENS.faint).text(fmt.month(d.m));
  });
}
drawSpark();

// Top substances
const topSubsEl=document.getElementById('topSubs');
topMonthSubs.forEach(d=>{
  const c=classify(d.substance);
  const chip=document.createElement('div');
  chip.style.cssText=`display:inline-flex;align-items:center;gap:6px;background:${TOKENS.panel2};border:1px solid ${c.color}44;border-radius:99px;padding:6px 12px;font-size:12px`;
  chip.innerHTML=`<span style="width:8px;height:8px;background:${c.color};border-radius:50%;display:inline-block"></span><span style="color:${c.color};font-weight:600;text-transform:capitalize">${d.substance}</span><span style="color:${TOKENS.faint};font-family:ui-monospace">${d.n}</span>`;
  topSubsEl.appendChild(chip);
});
addEventListener('resize',drawSpark);

</script>
