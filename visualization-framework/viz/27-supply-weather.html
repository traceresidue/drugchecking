const NAV_PAGE_ID = "27-supply-weather";
const NAV_MODE = "viz";
(function(){
/* Compact series navigation — dropdown, prev/next, home link.
   NAV_REGISTRY is inlined at build time from src/registry.json. */

const PREVIEW_FALLBACK = {
  '06a-ridgeline-filled': '06-spectral-ridgeline',
  '06b-ridgeline-3d': '06-spectral-ridgeline',
  '06c-ridgeline-filter': '06-spectral-ridgeline',
  '12a-co-nested': '12-cooccurrence-chord',

  '12c-co-undirected': '12-cooccurrence-chord',

  '17b-adulterant-3d': '17-adulterant-network',
  '17c-adulterant-orbit': '17-adulterant-network',
};

// A "variant" page is an alternate take on a canonical numbered visualization —
// e.g. 06b-ridgeline-3d is a variant of 06-spectral-ridgeline. Variants use the
// `<number><letter>-slug` id convention (already relied on above by
// PREVIEW_FALLBACK and below by navLabel's suffix logic); canonical pages use
// a bare `<number>-slug`. Inferring from the id — rather than a manually-set
// registry flag — means every future page is classified correctly for free as
// long as it follows this existing naming convention, with no separate field
// to remember to set (and no risk of the field and the id silently drifting
// apart).
function isVariantId(id) {
  return /^\d+[a-z]-/.test(id);
}

function pageFile(id, mode) {
  return mode === 'lab' ? `d-${id}.html` : `${id}.html`;
}

function previewId(id) {
  return PREVIEW_FALLBACK[id] || id;
}

function previewSrc(id, mode) {
  const base = mode === 'lab' ? '../viz/review-previews' : 'review-previews';
  return `${base}/${previewId(id)}.png`;
}

function injectNavCSS() {

  s.id = 'dcf-nav-css';
  s.textContent = `
  .dcf-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;margin:0 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:0;z-index:30}
  .dcf-nav-home{font:600 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid transparent;transition:color .15s,background .15s,border-color .15s}

  .dcf-nav-btn:disabled{opacity:.35;cursor:not-allowed}

function navLabel(entry) {
  const n = String(entry.n).padStart(2, '0');
  const suffix = isVariantId(entry.id) ? ` · ${entry.id.split('-').slice(1).join(' ')}` : '';
  return `Nº ${n} · ${entry.title}${suffix}`;
}

function injectNav({ pageId, mode = 'viz' } = {}) {
  if (!pageId || document.querySelector('.dcf-nav')) return;
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  if (!items.length) return;

  const idx = items.findIndex(e => e.id === pageId);
  const cur = idx >= 0 ? idx : 0;
  const prev = items[(cur - 1 + items.length) % items.length];
  const next = items[(cur + 1) % items.length];

  const nav = document.createElement('nav');
  nav.className = 'dcf-nav';
  nav.setAttribute('aria-label', 'Visualization series navigation');

  const home = document.createElement('a');
  home.className = 'dcf-nav-home';
  home.href = 'index.html';
  home.textContent = mode === 'lab' ? 'Design Lab' : 'All viz';

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.className = 'dcf-nav-btn';
  prevBtn.setAttribute('aria-label', `Previous: ${prev.title}`);
  prevBtn.textContent = '←';
  prevBtn.onclick = () => { location.href = pageFile(prev.id, mode); };

  const sel = document.createElement('select');
  sel.className = 'dcf-nav-select';
  sel.setAttribute('aria-label', 'Jump to visualization');
  items.forEach(entry => {
    const opt = document.createElement('option');
    opt.value = pageFile(entry.id, mode);
    opt.textContent = navLabel(entry);
    if (entry.id === pageId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { if (sel.value) location.href = sel.value; };

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'dcf-nav-btn';
  nextBtn.setAttribute('aria-label', `Next: ${next.title}`);
  nextBtn.textContent = '→';
  nextBtn.onclick = () => { location.href = pageFile(next.id, mode); };

  const pos = document.createElement('span');
  pos.className = 'dcf-nav-pos';
  pos.textContent = `${cur + 1} / ${items.length}`;

  nav.append(home, prevBtn, sel, nextBtn, pos);

  const hdr = document.querySelector('.dcf-h');
  if (hdr) document.body.insertBefore(nav, hdr);
  else document.body.prepend(nav);
}

function renderCard(entry, mode, { showVariantBadge = false } = {}) {
  const card = document.createElement('a');
  card.className = 'dcf-index-card';
  card.href = pageFile(entry.id, mode);
  card.setAttribute('role', 'listitem');
  card.setAttribute('aria-label', `${entry.title} — ${entry.cat}${showVariantBadge ? ' — variant' : ''}`);

  const thumb = document.createElement('div');
  thumb.className = 'dcf-index-thumb';
  const img = document.createElement('img');
  img.src = previewSrc(entry.id, mode);
  img.alt = '';
  img.loading = 'lazy';
  img.onerror = () => {
    img.remove();
    const fb = document.createElement('div');
    fb.className = 'dcf-index-thumb-fallback';
    fb.textContent = entry.cat;
    thumb.appendChild(fb);
  };
  thumb.appendChild(img);

  const body = document.createElement('div');
  body.className = 'dcf-index-body';
  body.innerHTML = `
    <div class="dcf-index-meta">Nº ${String(entry.n).padStart(2, '0')} · ${entry.cat}${showVariantBadge ? '<span class="dcf-index-variant-badge">Variant</span>' : ''}</div>
    <h2 class="dcf-index-title">${entry.title}</h2>
    <p class="dcf-index-cat">${entry.id.replace(/-/g, ' ')}</p>`;

  card.append(thumb, body);
  return card;
}

function renderGrid(entries, mode, opts) {
  const grid = document.createElement('div');
  grid.className = 'dcf-index-grid';
  grid.setAttribute('role', 'list');
  entries.forEach(entry => grid.appendChild(renderCard(entry, mode, opts)));
  return grid;
}

function buildIndexPage({ mode = 'viz', title, dek, switchHref } = {}) {
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  const canonical = items.filter(entry => !isVariantId(entry.id));
  const variants = items.filter(entry => isVariantId(entry.id));
  const prodHref = mode === 'lab' ? '../viz/index.html' : 'index.html';
  const labHref = mode === 'lab' ? 'index.html' : (switchHref || '../viz2/index.html');
  const hero = document.createElement('header');
  hero.className = 'dcf-index-hero';
  hero.innerHTML = `
    <h1>${title || 'Drug Checking Visualizations'}</h1>
    <p>${dek || ''}</p>
    <div class="dcf-index-switch">
      <a href="${prodHref}" aria-current="${mode === 'viz' ? 'page' : 'false'}">Production viz</a>
      <a href="${labHref}" aria-current="${mode === 'lab' ? 'page' : 'false'}">Design Lab</a>
    </div>`;

  // Primary, curated list: canonical numbered pages only (no a/b/c suffix).
  const grid = renderGrid(canonical, mode);

  document.body.append(hero, grid);

  // Secondary, clearly-labeled section: alternate takes on a canonical page
  // (same number, a/b/c suffix). Collapsed by default so a first-time viewer
  // sees the curated canonical list first, with variants one click away.
  if (variants.length) {
    const section = document.createElement('details');
    section.className = 'dcf-variants';
    const summary = document.createElement('summary');
    summary.textContent = `Variant explorations (${variants.length})`;
    const dekEl = document.createElement('p');
    dekEl.className = 'dcf-variants-dek';
    dekEl.textContent = 'Alternate takes on canonical numbered pages above — different chart forms or framings explored for the same data. Kept for reference, not part of the primary tour.';
    const variantGrid = renderGrid(variants, mode, { showVariantBadge: true });
    section.append(summary, dekEl, variantGrid);
    document.body.append(section);
  }
}


window.DCF_NAV={injectNav,buildIndexPage,pageFile,previewSrc};

})();
</script>
<script>
(function(){
/* Drug Checking Visualization Framework — shared helpers
   Loaded by every standalone visualization. Pure ES module, no dependencies.
   Provides: design tokens (CSS injection), substance classification + palette,
   spectral synthesis (Gaussian chromatograms, stick spectra, FTIR curves),
   formatting, tooltip, and a small DOM scaffold builder.

   DEPRECATED (fallback path): this file is the legacy, hand-rolled source of
   truth for design tokens/classify/spectral-synthesis logic. The canonical
   source is now web/packages/dcf-core/src/* — see build.py's SHARED
   assignment, which prefers the built dcf-core bundle
   (web/packages/dcf-core/dist/shared.js) when present and falls back to this
   file only when that build hasn't been produced yet. Keep this file in sync
   with web/packages/dcf-core/src/ by hand until dcf-core's build is verified
   equivalent and reliably available in CI, at which point this fallback
   should be deleted and build.py's SHARED logic simplified to always use
   dcf-core. Do not let the two drift silently — any change here should be
   mirrored there (and vice versa) until then. */

const TOKENS = {
  bg:'#0b0e14', panel:'#121826', panel2:'#1a2234', line:'#26304a',
  ink:'#e8ecf4', muted:'#8b94a8', faint:'#5b6478',
  opioid:'#ff8a5c', fent:'#ff5c7a', xyl:'#b388ff', stim:'#ffd166',
  coke:'#4cc9f0', benzo:'#7aa2ff', cut:'#6ee7a8', other:'#94a3b8',
  alert:'#ff5c7a', watch:'#ffd166', ok:'#6ee7a8', info:'#4cc9f0'
};

/* Sans-only UI prose + mono instrument readouts — always terminate with generic family. */
const FONTS = {
  sans:'Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
  mono:'"Cascadia Mono", ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace',
};

/* Map a substance name -> {class, color, label, action} */
const CLASS = {
  fent:{color:TOKENS.fent,label:'Fentanyl & analogs'},
  opioid:{color:TOKENS.opioid,label:'Opioid'},
  xyl:{color:TOKENS.xyl,label:'Sedative / xylazine'},
  stim:{color:TOKENS.stim,label:'Stimulant'},
  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
/* Broad families for filters and labels — cls stays fine-grained for chart colors. */
const FAMILY_MAP = {
  fent:'opioid', opioid:'opioid',
  stim:'stim', coke:'stim',
  xyl:'xyl', benzo:'benzo', cut:'cut', other:'other',
};
const FAMILY_LABEL = {
  opioid:'Opioid',
  stim:'Stimulant',
  xyl:'Sedative / xylazine',
  benzo:'Benzodiazepine',
  cut:'Cut / diluent',
  other:'Other',
};
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES){
    if(re.test(n)){
      const family = FAMILY_MAP[c] || c;
      return {cls:c,color:CLASS[c].color,label:CLASS[c].label,family,familyLabel:FAMILY_LABEL[family]||FAMILY_LABEL.other};
    }
  }
  return {cls:'other',...CLASS.other,family:'other',familyLabel:FAMILY_LABEL.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

/* ---- tooltip ---- */
let _tt;
function tooltip(){
  if(_tt) return _tt;
  _tt=document.createElement('div');
  _tt.style.cssText=`position:fixed;pointer-events:none;z-index:99;background:${TOKENS.panel2};border:1px solid ${TOKENS.line};border-radius:8px;padding:8px 10px;font:12px/1.4 ${FONTS.sans};color:${TOKENS.ink};box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:260px`;
  document.body.appendChild(_tt);
  return {
    show(html,x,y){_tt.innerHTML=html;_tt.style.opacity=1;const r=_tt.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth)nx=x-r.width-14;if(ny+r.height>innerHeight)ny=y-r.height-14;_tt.style.left=nx+'px';_tt.style.top=ny+'px';},
    hide(){_tt.style.opacity=0;}
  };
}

/* ---- page scaffold + global CSS ---- */
function scaffold({tag,title,dek,how,provenance,harm,pageId}={}){
  injectCSS();
  document.body.innerHTML=`
    <header class="dcf-h">
      <div class="dcf-tag">${tag||''}</div>
      <h1>${title||''}</h1>
      <p class="dek">${dek||''}</p>
    </header>
    <main id="stage"></main>
    <details class="dcf-how"><summary>How to read this</summary><div>${how||''}</div></details>
    <footer class="dcf-f">
      <p class="prov">${provenance||''}</p>
      ${harm?`<p class="harm">${harm}</p>`:''}
    </footer>`;
  const pid = pageId || (typeof NAV_PAGE_ID !== 'undefined' ? NAV_PAGE_ID : '');
  const mode = typeof NAV_MODE !== 'undefined' ? NAV_MODE : 'viz';
  if (pid && window.DCF_NAV) window.DCF_NAV.injectNav({ pageId: pid, mode });
  return document.getElementById('stage');
}
function injectFontLink(){
  if(document.getElementById('dcf-fonts')) return;
  const link=document.createElement('link');
  link.id='dcf-fonts';
  link.rel='stylesheet';
  link.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
  document.head.appendChild(link);
}

function injectCSS(){
  if(document.getElementById('dcf-css')) return;
  injectFontLink();
  const s=document.createElement('style'); s.id='dcf-css';
  s.textContent=`
  :root{
    --bg:${TOKENS.bg};--panel:${TOKENS.panel};--panel2:${TOKENS.panel2};--line:${TOKENS.line};
    --ink:${TOKENS.ink};--muted:${TOKENS.muted};--faint:${TOKENS.faint};
    --font-sans:${FONTS.sans};--font-mono:${FONTS.mono}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;font-feature-settings:"kern","liga","calt"}
  body{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .dcf-h{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .dcf-tag{font:600 11px/1 var(--font-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .dcf-h h1{font-size:27px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .dek{font-size:15px;line-height:1.5;color:var(--muted);margin:0;max-width:74ch}
  #stage{margin:18px 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .dcf-how{margin:22px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .dcf-how summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink);list-style:none}
  .dcf-how summary::before{content:"ⓘ ";color:var(--muted)}
  .dcf-how[open] summary{border-bottom:1px solid var(--line)}
  .dcf-how>div{padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .dcf-how b{color:var(--ink)}
  .dcf-f{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}
  .dcf-f .prov{color:var(--faint);margin:0 0 6px}
  .dcf-f .harm{color:var(--muted);margin:0;padding-left:11px;border-left:3px solid ${TOKENS.ok}}
  button.tgl{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:500 13px var(--font-sans);cursor:pointer;transition:.15s}
  .dcf-ctl-select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 13px var(--font-sans);min-height:40px}
  svg text{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  button.tgl:hover{background:var(--panel2);color:var(--ink)}
  button.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=range]{accent-color:${TOKENS.info}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  `;
  document.head.appendChild(s);
}

/* draw a 2D structure from SMILES into a <canvas id=...>; needs SmilesDrawer loaded.
   Uses the canvas DrawerBase path (SmilesDrawer.Drawer SVG→canvas is broken in the vendored build). */
let _smilesCanvasDrawer=null;
function smilesCanvasDrawer(w,h){
  if(_smilesCanvasDrawer) return _smilesCanvasDrawer;
  _smilesCanvasDrawer=new SmilesDrawer.SvgDrawer({
    width:w,height:h,padding:14,bondThickness:1.1,
    themes:{
      dcf:{
        C:'#cfd6e4',N:'#7aa2ff',O:'#ff8a5c',F:'#6ee7a8',S:'#ffd166',
        CL:'#6ee7a8',BR:'#ff8a5c',I:'#b388ff',P:'#d35400',B:'#e67e22',SI:'#e67e22',
        H:'#8b94a8',BACKGROUND:'#0e1320',
      },
    },
  }).preprocessor;
  return _smilesCanvasDrawer;
}
function smilesStructureNA(el,h){
  const c=el.getContext&&el.getContext('2d');
  if(c){c.fillStyle='#5b6478';c.font='11px '+FONTS.sans;c.fillText('structure n/a',8,h/2);}
}
function drawSmiles(smiles,canvasId,w=160,h=120){
  const el=document.getElementById(canvasId);
  if(!el||typeof SmilesDrawer==='undefined'||!smiles){ if(el) smilesStructureNA(el,h); return; }
  try{
    const drawer=smilesCanvasDrawer(w,h);
    SmilesDrawer.parse(smiles,t=>{
      try{ drawer.draw(t,el,'dcf',false); }
      catch(_){ try{ drawer.draw(t,el,'dark',false); } catch(__){ smilesStructureNA(el,h); } }
    },()=>{ smilesStructureNA(el,h); });
  }catch(e){ smilesStructureNA(el,h); }
}


window.DCF={TOKENS,FONTS,classify,fmt,chromatogram,ftirCurve,stickSpectrum,cosine,tooltip,scaffold,injectCSS,drawSmiles};

})();
</script>
<script>
/* Nº 27 · Supply Weather Report — the most recent month's supply composition
   expressed as a weather metaphor: a risk index, "conditions" (fentanyl %, xylazine %,
   novel substance alerts), and a 3-month outlook sparkline. A public-facing
   one-glance risk communication format. */
const {scaffold,classify,fmt,tooltip,TOKENS}=DCF;
const MC=DATA.monthly_class, MN=DATA.monthly;

const stage=scaffold({
  tag:'Nº 27 · EXPERIMENTAL',
  title:'Supply Weather Report',
  dek:'What\'s the current "weather" in the local drug supply? A risk index, current conditions, and a 3-month outlook — styled for the person who checks the forecast before they use.',
  how:`This adapts the <b>weather forecast</b> metaphor for drug supply risk communication. The <b>risk index</b> (0–10) is a composite of fentanyl positivity, xylazine prevalence, and mixture complexity in the most recent tested month. <b>Conditions</b> show the key current hazards. The <b>outlook sparkline</b> shows how the index trended over the past 6 months. This is <i>not</i> a real-time system — it reflects testing data from the most recent month in the dataset. <b>Concept:</b> the format is deliberately legible for people with limited health literacy; a weather app is universally understood.`,
  provenance:'Risk index calculated from real monthly supply composition data (6,580-sample dataset). Most recent month shown.',
  harm:'Like real weather, risk varies day-to-day and batch-to-batch. Always test, always carry naloxone, never use alone — even on a "low risk" day.'
});

// Get latest month
const months=[...new Set(MC.map(d=>d.month))].sort();
const latestMonth=months[months.length-1];

// Calculate a risk index for each month (0–10 scale)
function calcRisk(month){
  const rows=MC.filter(d=>d.month===month);
  const total=rows.reduce((a,b)=>a+b.n,0)||1;
  const fentN=(rows.find(d=>d.cls==='fent')||{n:0}).n;
  const xylN=(rows.find(d=>d.cls==='xyl')||{n:0}).n;
  const otherN=(rows.find(d=>d.cls==='other')||{n:0}).n;
  const benzoN=(rows.find(d=>d.cls==='benzo')||{n:0}).n;
  const fentPct=fentN/total, xylPct=xylN/total, novelPct=(otherN+benzoN)/total;
  // weighted risk
  return Math.min(10,(fentPct*5 + xylPct*3.5 + novelPct*1.5)*10);
}

const riskHistory=months.slice(-7).map(m=>({m,r:calcRisk(m)}));
const currentRisk=riskHistory[riskHistory.length-1]?.r||5;

// Current conditions
const latestRows=MC.filter(d=>d.month===latestMonth);
const totalLast=latestRows.reduce((a,b)=>a+b.n,0)||1;
function classShare(cls){return (latestRows.find(d=>d.cls===cls)||{n:0}).n/totalLast;}
const fentPct=classShare('fent'), xylPct=classShare('xyl'), benzoPct=classShare('benzo'), otherPct=classShare('other');

// Top new substances this month
const topMonthSubs=MN.filter(d=>d.month===latestMonth).sort((a,b)=>b.n-a.n).slice(0,5);

function riskLabel(r){
  if(r<3)return{icon:'🌤',label:'Low',color:TOKENS.ok,advice:'Lower volatility, but the supply still contains fentanyl. Test every time.'};
  if(r<5.5)return{icon:'⛅',label:'Moderate',color:TOKENS.watch,advice:'Significant fentanyl present. Never use alone. Have naloxone.'};
  if(r<7.5)return{icon:'🌩',label:'High',color:TOKENS.alert,advice:'High fentanyl + xylazine. Multiple doses of naloxone needed. 911 on standby.'};
  return{icon:'🌪',label:'Extreme',color:TOKENS.alert,advice:'Severe mixture complexity. Naloxone may not be enough alone — call 911 immediately if overdose.'};
}
const {icon,label,color,advice}=riskLabel(currentRisk);

stage.innerHTML=`
<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:18px">
  <div class="panel" style="text-align:center;padding:28px 18px">
    <div style="font-size:72px;line-height:1;margin-bottom:12px" role="img" aria-label="risk weather icon">${icon}</div>
    <div style="font:700 48px ui-monospace;color:${color}">${currentRisk.toFixed(1)}<span style="font-size:22px;color:${TOKENS.muted}">/10</span></div>
    <div style="font-size:22px;font-weight:700;color:${color};margin:6px 0">${label} Risk</div>
    <div class="muted" style="font-size:12px;margin-top:4px">${fmt.month(latestMonth)} · most recent data</div>
    <div style="margin-top:16px;padding:12px;background:#0b0e14;border-radius:10px;font-size:13px;line-height:1.5;color:${TOKENS.ink};text-align:left">${advice}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="panel">
      <div class="muted" style="font-size:11px;letter-spacing:.12em;margin-bottom:12px">CURRENT CONDITIONS · ${fmt.month(latestMonth)}</div>
      <div id="conditions"></div>
    </div>
    <div class="panel">
      <div class="muted" style="font-size:11px;letter-spacing:.12em;margin-bottom:6px">6-MONTH RISK TREND</div>
      <svg id="spark" width="100%" height="90"></svg>
    </div>
  </div>
</div>
<div class="panel" style="margin-top:14px">
  <div class="muted" style="font-size:11px;letter-spacing:.12em;margin-bottom:10px">MOST DETECTED THIS MONTH</div>
  <div id="topSubs" style="display:flex;gap:10px;flex-wrap:wrap"></div>
</div>`;

// Conditions panel
const conditions=[
  {label:'Fentanyl',pct:fentPct,color:TOKENS.fent,icon:'⚠️',note:fentPct>0.5?'Very high prevalence':'Present in supply'},
  {label:'Xylazine',pct:xylPct,color:TOKENS.xyl,icon:'🩹',note:xylPct>0.3?'High — wounds + deep sedation risk':'Detected; rescue breathing needed'},
  {label:'Benzodiazepines',pct:benzoPct,color:TOKENS.benzo,icon:'💊',note:'Prolongs sedation; naloxone doesn\'t reverse'},
  {label:'Unclassified / Novel',pct:otherPct,color:TOKENS.other,icon:'🔬',note:'Unknown potency — maximum caution'},
];
const condEl=document.getElementById('conditions');
conditions.forEach(c=>{
  const div=document.createElement('div');
  div.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px';
  const pctBar=Math.round(c.pct*100);
  div.innerHTML=`<div style="font-size:20px">${c.icon}</div>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-weight:600;font-size:13px;color:${c.color}">${c.label}</span>
        <span style="font-family:ui-monospace;font-size:12px;color:${c.color}">${pctBar}%</span>
      </div>
      <div style="background:#1a2234;border-radius:4px;height:6px">
        <div style="background:${c.color};height:6px;border-radius:4px;width:${pctBar}%;transition:.4s ease"></div>
      </div>
      <div style="font-size:11px;color:${TOKENS.muted};margin-top:3px">${c.note}</div>
    </div>`;
  condEl.appendChild(div);
});

// Sparkline
function drawSpark(){
  const svg=d3.select('#spark'); svg.selectAll('*').remove();
  const W=svg.node().clientWidth||300,H=90,m={t:10,r:8,b:24,l:8};
  const x=d3.scalePoint(riskHistory.map(d=>d.m),[m.l,W-m.r]);
  const y=d3.scaleLinear([0,10],[H-m.b,m.t]);
  const area=d3.area().x(d=>x(d.m)).y0(H-m.b).y1(d=>y(d.r)).curve(d3.curveCatmullRom);
  const line=d3.line().x(d=>x(d.m)).y(d=>y(d.r)).curve(d3.curveCatmullRom);
  svg.append('path').datum(riskHistory).attr('d',area).attr('fill',color).attr('opacity',.18);
  svg.append('path').datum(riskHistory).attr('d',line).attr('fill','none').attr('stroke',color).attr('stroke-width',2);
  riskHistory.forEach(d=>{
    svg.append('circle').attr('cx',x(d.m)).attr('cy',y(d.r)).attr('r',3).attr('fill',d.m===latestMonth?color:TOKENS.muted);
    svg.append('text').attr('x',x(d.m)).attr('y',H-8).attr('text-anchor','middle').attr('font-size',9).attr('font-family','ui-monospace').attr('fill',TOKENS.faint).text(fmt.month(d.m));
  });
}
drawSpark();

// Top substances
const topSubsEl=document.getElementById('topSubs');
topMonthSubs.forEach(d=>{
  const c=classify(d.substance);
  const chip=document.createElement('div');
  chip.style.cssText=`display:inline-flex;align-items:center;gap:6px;background:${TOKENS.panel2};border:1px solid ${c.color}44;border-radius:99px;padding:6px 12px;font-size:12px`;
  chip.innerHTML=`<span style="width:8px;height:8px;background:${c.color};border-radius:50%;display:inline-block"></span><span style="color:${c.color};font-weight:600;text-transform:capitalize">${d.substance}</span><span style="color:${TOKENS.faint};font-family:ui-monospace">${d.n}</span>`;
  topSubsEl.appendChild(chip);
});
addEventListener('resize',drawSpark);

</script>
