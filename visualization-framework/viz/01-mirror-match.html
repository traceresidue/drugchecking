<script>

window.SPEC = {"ms":{"fentanyl":{"mw":336,"smiles":"CCC(=O)N(c1ccccc1)C1CCN(CCc2ccccc2)CC1","peaks":[[42,30],[57,14],[77,20],[91,26],[105,44],[132,30],[146,79],[158,34],[189,60],[202,14],[245,100],[287,9],[336,7]]},"4-anpp":{"mw":280,"smiles":"c1ccc(CCN2CCC(Nc3ccccc3)CC2)cc1","peaks":[[56,18],[77,22],[91,32],[105,58],[120,20],[146,100],[189,42],[207,12],[280,16]]},"cocaine":{"mw":303,"smiles":"COC(=O)C1C(OC(=O)c2ccccc2)CC2CCC1N2C","peaks":[[42,22],[82,100],[94,30],[105,26],[122,18],[152,12],[182,86],[198,22],[272,10],[303,16]]},"methamphetamine":{"mw":149,"smiles":"CC(Cc1ccccc1)NC","peaks":[[58,100],[65,7],[91,16],[115,4],[134,5],[148,2]]},"xylazine":{"mw":220,"smiles":"Cc1cccc(C)c1NC1=NCCCS1","peaks":[[68,18],[105,22],[130,26],[145,34],[172,28],[187,20],[205,100],[220,46]]},"heroin":{"mw":369,"smiles":"CC(=O)Oc1ccc2c3c1OC1C(OC(C)=O)C=CC4C(C2)N(C)CCC314","peaks":[[43,62],[81,28],[146,22],[204,32],[215,24],[268,56],[310,42],[327,72],[369,48]]},"caffeine":{"mw":194,"smiles":"Cn1cnc2c1c(=O)n(C)c(=O)n2C","peaks":[[55,34],[67,18],[82,30],[109,42],[137,10],[165,14],[194,100]]},"acetaminophen":{"mw":151,"smiles":"CC(=O)Nc1ccc(O)cc1","peaks":[[43,42],[65,16],[80,26],[109,62],[151,100]]},"lidocaine":{"mw":234,"smiles":"CCN(CC)CC(=O)Nc1c(C)cccc1C","peaks":[[58,42],[72,22],[86,100],[120,8],[234,9]]},"diphenhydramine":{"mw":255,"smiles":"CN(C)CCOC(c1ccccc1)c1ccccc1","peaks":[[58,100],[73,16],[152,10],[165,42],[167,26],[183,8]]},"bromazolam":{"mw":353,"smiles":"Cc1nnc2n1-c1ccc(Br)cc1C(c1ccccc1)=NC2","peaks":[[77,18],[179,22],[246,20],[275,42],[326,32],[352,100]]},"levamisole":{"mw":204,"smiles":"C1CN2CC(c3ccccc3)N=C2S1","peaks":[[73,30],[148,40],[176,22],[204,100]]},"quinine":{"mw":324,"smiles":"COc1ccc2nccc(C(O)C3CC4CCN3CC4C=C)c2c1","peaks":[[81,40],[136,100],[172,18],[189,14],[324,30]]},"p-fluorofentanyl":{"mw":354,"smiles":"CCC(=O)N(c1ccc(F)cc1)C1CCN(CCc2ccccc2)CC1","peaks":[[105,40],[146,72],[164,38],[189,52],[245,30],[263,100],[305,8],[354,6]]}}};

<script>
(function(){
/* Drug Checking Visualization Framework — shared helpers
   Loaded by every standalone visualization. Pure ES module, no dependencies.
   Provides: design tokens (CSS injection), substance classification + palette,
   spectral synthesis (Gaussian chromatograms, stick spectra, FTIR curves),
   formatting, tooltip, and a small DOM scaffold builder. */

const TOKENS = {
  bg:'#0b0e14', panel:'#121826', panel2:'#1a2234', line:'#26304a',
  ink:'#e8ecf4', muted:'#8b94a8', faint:'#5b6478',
  opioid:'#ff8a5c', fent:'#ff5c7a', xyl:'#b388ff', stim:'#ffd166',
  coke:'#4cc9f0', benzo:'#7aa2ff', cut:'#6ee7a8', other:'#94a3b8',
  alert:'#ff5c7a', watch:'#ffd166', ok:'#6ee7a8', info:'#4cc9f0'
};

/* Map a substance name -> {class, color, label, action} */
const CLASS = {
  fent:{color:TOKENS.fent,label:'Fentanyl & analogs'},
  opioid:{color:TOKENS.opioid,label:'Opioid'},
  xyl:{color:TOKENS.xyl,label:'Sedative / xylazine'},
  stim:{color:TOKENS.stim,label:'Stimulant'},
  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES) if(re.test(n)) return {cls:c,...CLASS[c]};
  return {cls:'other',...CLASS.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

/* ---- tooltip ---- */
let _tt;
function tooltip(){
  if(_tt) return _tt;
  _tt=document.createElement('div');
  _tt.style.cssText=`position:fixed;pointer-events:none;z-index:99;background:${TOKENS.panel2};border:1px solid ${TOKENS.line};border-radius:8px;padding:8px 10px;font:12px/1.4 Inter,system-ui;color:${TOKENS.ink};box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:260px`;
  document.body.appendChild(_tt);
  return {
    show(html,x,y){_tt.innerHTML=html;_tt.style.opacity=1;const r=_tt.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth)nx=x-r.width-14;if(ny+r.height>innerHeight)ny=y-r.height-14;_tt.style.left=nx+'px';_tt.style.top=ny+'px';},
    hide(){_tt.style.opacity=0;}
  };
}

/* ---- page scaffold + global CSS ---- */
function scaffold({tag,title,dek,how,provenance,harm}={}){
  injectCSS();
  document.body.innerHTML=`
    <header class="dcf-h">
      <div class="dcf-tag">${tag||''}</div>
      <h1>${title||''}</h1>
      <p class="dek">${dek||''}</p>
    </header>
    <main id="stage"></main>
    <details class="dcf-how"><summary>How to read this</summary><div>${how||''}</div></details>
    <footer class="dcf-f">
      <p class="prov">${provenance||''}</p>
      ${harm?`<p class="harm">${harm}</p>`:''}
    </footer>`;
  return document.getElementById('stage');
}
function injectCSS(){
  if(document.getElementById('dcf-css')) return;
  const s=document.createElement('style'); s.id='dcf-css';
  s.textContent=`
  :root{--bg:${TOKENS.bg};--panel:${TOKENS.panel};--panel2:${TOKENS.panel2};--line:${TOKENS.line};--ink:${TOKENS.ink};--muted:${TOKENS.muted};--faint:${TOKENS.faint}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",monospace}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .dcf-h{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .dcf-tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .dcf-h h1{font-size:27px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .dek{font-size:15px;line-height:1.5;color:var(--muted);margin:0;max-width:74ch}
  #stage{margin:18px 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .dcf-how{margin:22px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .dcf-how summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink);list-style:none}
  .dcf-how summary::before{content:"ⓘ ";color:var(--muted)}
  .dcf-how[open] summary{border-bottom:1px solid var(--line)}
  .dcf-how>div{padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .dcf-how b{color:var(--ink)}
  .dcf-f{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}
  .dcf-f .prov{color:var(--faint);margin:0 0 6px}
  .dcf-f .harm{color:var(--muted);margin:0;padding-left:11px;border-left:3px solid ${TOKENS.ok}}
  button.tgl{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:500 13px Inter;cursor:pointer;transition:.15s}
  button.tgl:hover{background:var(--panel2);color:var(--ink)}
  button.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=range]{accent-color:${TOKENS.info}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  `;
  document.head.appendChild(s);
}

/* draw a 2D structure from SMILES into a <canvas id=...>; needs SmilesDrawer loaded.
   Uses the dark theme tuned to the framework background. No-ops gracefully if absent. */
function drawSmiles(smiles,canvasId,w=160,h=120){
  const el=document.getElementById(canvasId);
  if(!el||typeof SmilesDrawer==='undefined'||!smiles){ if(el){const c=el.getContext&&el.getContext('2d');if(c){c.fillStyle='#5b6478';c.font='11px Inter';c.fillText('structure n/a',8,h/2);}} return; }
  try{
    const drawer=new SmilesDrawer.Drawer({width:w,height:h,padding:14,bondThickness:1.1,
      themes:{dcf:{C:'#cfd6e4',N:'#7aa2ff',O:'#ff8a5c',F:'#6ee7a8',S:'#ffd166',Cl:'#6ee7a8',Br:'#ff8a5c',
        BACKGROUND:'#0e1320',bond:'#9aa6bd',default:'#cfd6e4'}}});
    SmilesDrawer.parse(smiles,t=>drawer.draw(t,canvasId,'dcf',false),()=>{});
  }catch(e){}
}


window.DCF={TOKENS,classify,fmt,chromatogram,ftirCurve,stickSpectrum,cosine,tooltip,scaffold,injectCSS,drawSmiles};

})();
</script>
<script>
/* Nº 01 · Spectral Mirror Match — head-to-tail comparison of a seized sample's
   mass spectrum against a library reference, with matched fragments highlighted
   and a cosine similarity score. The classic spectrum_utils pattern, made interactive. */
const {scaffold,stickSpectrum,cosine,tooltip,fmt,TOKENS,classify}=DCF;
const MS=SPEC.ms;
const names=Object.keys(MS);

const stage=scaffold({
  tag:'Nº 01 · MS',
  title:'Spectral Mirror Match',
  dek:'Is this really what the library says it is? The seized sample (top) is mirrored against a reference spectrum (bottom). Matched fragment ions light up; the cosine score rates the fit.',
  how:`<b>Mass spectrum.</b> Electron-impact fragmentation breaks a molecule into charged pieces; each vertical stick is a fragment at a mass-to-charge ratio (<span class="mono">m/z</span>), scaled so the tallest = 100%. The molecular ion <span class="mono">M⁺•</span> (whole molecule) is marked. <b>Matching:</b> sticks that line up within ±0.5 <span class="mono">m/z</span> turn solid and connect; the <b>cosine score</b> (0–1) summarises overall agreement — a real confirmation lab also checks retention time and uses high-resolution mass. <b>Limits:</b> a high score is strong evidence of identity but isotomers and mixtures can fool any single method.`,
  provenance:'Spectra are illustrative: fragment positions reflect characteristic ions; intensities approximate. Not for analytical identification.',
  harm:'A library match confirms <i>what</i> is present, never <i>how much</i>. Peak height is not potency.'
});

stage.innerHTML=`
<div class="controls">
  <label class="muted" style="font-size:13px">Seized sample reads as</label>
  <select id="samp"></select>
  <label class="muted" style="font-size:13px">compare against library</label>
  <select id="ref"></select>
  <button class="tgl" id="noise" aria-pressed="false">add realistic noise</button>
</div>
<div class="panel"><svg id="svg" width="100%" height="460" role="img" aria-label="Mirror plot comparing two mass spectra"></svg></div>
<div id="score" style="margin-top:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap"></div>`;

const sampSel=document.getElementById('samp'), refSel=document.getElementById('ref');
for(const n of names){
  sampSel.add(new Option(n,n)); refSel.add(new Option(n,n));
}
sampSel.value='fentanyl'; refSel.value='fentanyl';
[sampSel,refSel].forEach(s=>{s.style.cssText='background:#1a2234;color:#e8ecf4;border:1px solid #26304a;border-radius:8px;padding:7px 10px;font:500 13px Inter';});

const tt=tooltip();
let noise=false;
document.getElementById('noise').onclick=e=>{noise=!noise;e.target.setAttribute('aria-pressed',noise);draw();};
sampSel.onchange=refSel.onchange=draw;

function jitter(peaks){
  if(!noise) return peaks;
  const out=peaks.map(p=>({mz:p.mz,i:Math.max(0,p.i+(Math.random()-.5)*6)}));
  for(let k=0;k<14;k++) out.push({mz:40+Math.random()*300,i:Math.random()*9});
  return out;
}

function draw(){
  const svg=d3.select('#svg'); svg.selectAll('*').remove();
  const W=svg.node().clientWidth,H=460,m={t:24,r:16,b:34,l:46};
  const top=jitter(stickSpectrum(MS[sampSel.value].peaks));
  const bot=stickSpectrum(MS[refSel.value].peaks);
  const allmz=[...top,...bot].map(d=>d.mz);
  const x=d3.scaleLinear([Math.min(...allmz)-12,Math.max(...allmz)+12],[m.l,W-m.r]);
  const midY=H/2;
  const yUp=d3.scaleLinear([0,100],[midY-10,m.t]);
  const yDn=d3.scaleLinear([0,100],[midY+10,H-m.b]);

  // matched set
  const matched=new Set();
  for(const a of top){for(const b of bot){if(Math.abs(a.mz-b.mz)<=0.5){matched.add(Math.round(a.mz));}}}

  // zero axis
  svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',midY).attr('y2',midY).attr('stroke',TOKENS.line);
  // x ticks
  x.ticks(8).forEach(t=>{
    svg.append('text').attr('x',x(t)).attr('y',H-12).attr('fill',TOKENS.faint).attr('font-size',11).attr('text-anchor','middle').attr('font-family','ui-monospace').text(t);
  });
  svg.append('text').attr('x',W-m.r).attr('y',midY-6).attr('text-anchor','end').attr('fill',TOKENS.muted).attr('font-size',11).text('m/z →');
  // labels
  svg.append('text').attr('x',m.l).attr('y',m.t-8).attr('fill',TOKENS.ink).attr('font-size',12).attr('font-weight',600).text('▲ Seized sample');
  svg.append('text').attr('x',m.l).attr('y',H-m.b+22).attr('fill',TOKENS.muted).attr('font-size',12).attr('font-weight',600).text('▼ Library reference');

  const colS=classify(sampSel.value).color, colR=classify(refSel.value).color;
  function sticks(data,y,col,up){
    const g=svg.append('g');
    g.selectAll('line').data(data).join('line')
      .attr('x1',d=>x(d.mz)).attr('x2',d=>x(d.mz))
      .attr('y1',y(0)).attr('y2',d=>y(d.i))
      .attr('stroke',d=>matched.has(Math.round(d.mz))?col:TOKENS.faint)
      .attr('stroke-width',d=>matched.has(Math.round(d.mz))?2.4:1.3)
      .attr('opacity',d=>matched.has(Math.round(d.mz))?1:.55)
      .style('cursor','pointer')
      .on('mousemove',(e,d)=>tt.show(`<b>m/z ${fmt.mz(d.mz)}</b><br><span class="muted">${fmt.pct(d.i)} rel.</span>${matched.has(Math.round(d.mz))?'<br>✓ matched':''}`,e.clientX,e.clientY))
      .on('mouseleave',tt.hide);
    // label top peaks
    const labels=[...data].sort((a,b)=>b.i-a.i).slice(0,5);
    g.selectAll('text').data(labels).join('text')
      .attr('x',d=>x(d.mz)).attr('y',d=>y(d.i)+(up?-6:12))
      .attr('text-anchor','middle').attr('font-size',10).attr('font-family','ui-monospace')
      .attr('fill',d=>matched.has(Math.round(d.mz))?col:TOKENS.muted).text(d=>fmt.mz(d.mz));
  }
  sticks(top,yUp,colS,true); sticks(bot,yDn,colR,false);
  // molecular ions
  [[MS[sampSel.value].mw,yUp,colS,true],[MS[refSel.value].mw,yDn,colR,false]].forEach(([mw,y,c,up])=>{
    svg.append('text').attr('x',x(mw)).attr('y',up?m.t+12:H-m.b-2).attr('text-anchor','middle').attr('font-size',10).attr('fill',c).text('M⁺• '+mw);
  });

  const score=cosine(top,bot);
  const verdict=score>0.9?['Strong match',TOKENS.ok]:score>0.6?['Partial match — check further',TOKENS.watch]:['Poor match',TOKENS.alert];
  document.getElementById('score').innerHTML=
    `<div style="font:700 34px ui-monospace;color:${verdict[1]}">${score.toFixed(3)}</div>
     <div><div style="font-size:13px;color:${verdict[1]};font-weight:600">${verdict[0]}</div>
     <div class="muted" style="font-size:12px">cosine similarity · ${matched.size} fragments matched</div></div>`;
}
draw();
addEventListener('resize',draw);

</script>
</body>
