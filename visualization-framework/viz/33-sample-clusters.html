function navLabel(entry) {
  const n = String(entry.n).padStart(2, '0');
  const variant = entry.id.match(/^\d+[a-z]-/);
  const suffix = variant ? ` · ${entry.id.split('-').slice(1).join(' ')}` : '';
  return `Nº ${n} · ${entry.title}${suffix}`;
}

function injectNav({ pageId, mode = 'viz' } = {}) {
  if (!pageId || document.querySelector('.dcf-nav')) return;
  injectNavCSS();
  const items = typeof NAV_REGISTRY !== 'undefined' ? NAV_REGISTRY : [];
  if (!items.length) return;

  const idx = items.findIndex(e => e.id === pageId);
  const cur = idx >= 0 ? idx : 0;
  const prev = items[(cur - 1 + items.length) % items.length];
  const next = items[(cur + 1) % items.length];

  const nav = document.createElement('nav');
  nav.className = 'dcf-nav';
  nav.setAttribute('aria-label', 'Visualization series navigation');

  const home = document.createElement('a');
  home.className = 'dcf-nav-home';
  home.href = 'index.html';
  home.textContent = mode === 'lab' ? 'Design Lab' : 'All viz';

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.className = 'dcf-nav-btn';
  prevBtn.setAttribute('aria-label', `Previous: ${prev.title}`);
  prevBtn.textContent = '←';
  prevBtn.onclick = () => { location.href = pageFile(prev.id, mode); };

  const sel = document.createElement('select');
  sel.className = 'dcf-nav-select';
  sel.setAttribute('aria-label', 'Jump to visualization');
  items.forEach(entry => {
    const opt = document.createElement('option');
    opt.value = pageFile(entry.id, mode);
    opt.textContent = navLabel(entry);
    if (entry.id === pageId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { if (sel.value) location.href = sel.value; };

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'dcf-nav-btn';
  nextBtn.setAttribute('aria-label', `Next: ${next.title}`);
  nextBtn.textContent = '→';
  nextBtn.onclick = () => { location.href = pageFile(next.id, mode); };

  const pos = document.createElement('span');
  pos.className = 'dcf-nav-pos';
  pos.textContent = `${cur + 1} / ${items.length}`;

  nav.append(home, prevBtn, sel, nextBtn, pos);

  const hdr = document.querySelector('.dcf-h');
  if (hdr) document.body.insertBefore(nav, hdr);
  else document.body.prepend(nav);
}

  return wrap;
}

function render(){
  grid.innerHTML='';
  ARCHETYPES.forEach(a=>grid.appendChild(drawCluster(a,140)));
}

// Legend
const legendWrap=document.createElement('div');
legendWrap.style.cssText='margin-top:18px;padding:12px 16px;background:#1a2234;border-radius:10px;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;align-items:center';
legendWrap.innerHTML=`
  <span class="muted" style="font-weight:700;font-size:10px;letter-spacing:.1em">RING KEY:</span>
  <span style="display:flex;align-items:center;gap:6px"><svg width="22" height="22"><circle cx="11" cy="11" r="7" fill="${TOKENS.fent}" opacity="0.9"/><circle cx="11" cy="11" r="11" fill="none" stroke="${TOKENS.fent}" stroke-width="1.5" opacity="0.35"/></svg><span style="color:${TOKENS.muted}">Primary substance (center + ring)</span></span>
  <span style="display:flex;align-items:center;gap:6px"><svg width="22" height="22"><circle cx="11" cy="11" r="5" fill="${TOKENS.stim}" opacity="0.8"/></svg><span style="color:${TOKENS.muted}">Secondary / adulterant (inner ring)</span></span>
  <span style="display:flex;align-items:center;gap:6px"><svg width="22" height="22"><circle cx="11" cy="11" r="3.5" fill="${TOKENS.cut}" opacity="0.55"/></svg><span style="color:${TOKENS.muted}">Trace compound (outer ring)</span></span>`;
stage.appendChild(legendWrap);

render();

</script>
</body>
