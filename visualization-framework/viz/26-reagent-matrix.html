<script>
(function(){
/* Drug Checking Visualization Framework — shared helpers
   Loaded by every standalone visualization. Pure ES module, no dependencies.
   Provides: design tokens (CSS injection), substance classification + palette,
   spectral synthesis (Gaussian chromatograms, stick spectra, FTIR curves),
   formatting, tooltip, and a small DOM scaffold builder. */

const TOKENS = {
  bg:'#0b0e14', panel:'#121826', panel2:'#1a2234', line:'#26304a',
  ink:'#e8ecf4', muted:'#8b94a8', faint:'#5b6478',
  opioid:'#ff8a5c', fent:'#ff5c7a', xyl:'#b388ff', stim:'#ffd166',
  coke:'#4cc9f0', benzo:'#7aa2ff', cut:'#6ee7a8', other:'#94a3b8',
  alert:'#ff5c7a', watch:'#ffd166', ok:'#6ee7a8', info:'#4cc9f0'
};

/* Map a substance name -> {class, color, label, action} */
const CLASS = {
  fent:{color:TOKENS.fent,label:'Fentanyl & analogs'},
  opioid:{color:TOKENS.opioid,label:'Opioid'},
  xyl:{color:TOKENS.xyl,label:'Sedative / xylazine'},
  stim:{color:TOKENS.stim,label:'Stimulant'},
  coke:{color:TOKENS.coke,label:'Cocaine'},
  benzo:{color:TOKENS.benzo,label:'Benzodiazepine'},
  cut:{color:TOKENS.cut,label:'Cut / diluent'},
  other:{color:TOKENS.other,label:'Other'}
};
const RULES = [
  [/fentanyl|anpp|despropionyl|norfentanyl|acetylfentanyl|n-phenylpropanamide|phenethyl/i,'fent'],
  [/nitazene|etonitazene|metonitazene|protonitazene|isotonitazene/i,'fent'],
  [/heroin|morphine|codeine|6-mam|monoacetylmorphine|oxycodone|hydromorphone|tramadol|mitragynine|opioid/i,'opioid'],
  [/xylazine|medetomidine|detomidine|clonidine/i,'xyl'],
  [/bromazolam|flualprazolam|alprazolam|etizolam|diazepam|clonazolam|benzodiazep|flubromazolam|diclazepam/i,'benzo'],
  [/methamphetamine|amphetamine|mdma|cathinone|methylenedioxy|n,n-dimethylamphetamine/i,'stim'],
  [/cocaine|benzoylecgonine|ecgonine/i,'coke'],
  [/caffeine|acetaminophen|paracetamol|lidocaine|levamisole|quinine|mannitol|lactose|sucrose|cellulose|diphenhydramine|sulfone|msm|sugar|inositol|procaine|benzocaine|phenacetin|gabapentin|dimethyl|sebacate|btmps|piperidyl|boric|sorbitol|maltose|glucose|creatine|diacetin|tetramethyl/i,'cut'],
];
function classify(name=''){
  const n = String(name).toLowerCase();
  for(const [re,c] of RULES) if(re.test(n)) return {cls:c,...CLASS[c]};
  return {cls:'other',...CLASS.other};
}

/* ---- formatting ---- */
const fmt = {
  mz:v=>`${(+v).toFixed(0)}`,
  rt:v=>`${(+v).toFixed(2)}`,
  pct:v=>`${(+v).toFixed(0)}%`,
  int:v=>(+v).toLocaleString('en-US'),
  month:m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}
};

/* ---- spectral synthesis ---- */
// Sum-of-Gaussians chromatogram trace. peaks:[{rt,amp}], returns {x:[],y:[]}
function chromatogram(peaks,{x0=2,x1=13,n=900,sigma=0.045}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const t=x0+(x1-x0)*i/(n-1); x.push(t);
    let v=0; for(const p of peaks){const d=(t-p.rt)/(p.sigma||sigma); v+=p.amp*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  const mx=Math.max(...y,1e-9);
  return {x,y:y.map(v=>v/mx*100)};
}
// FTIR absorbance curve from bands [[center,intensity,width],...]; reversed x handled by caller
function ftirCurve(bands,{x0=4000,x1=400,n=1100}={}){
  const x=[],y=[];
  for(let i=0;i<n;i++){
    const w=x0+(x1-x0)*i/(n-1); x.push(w);
    let v=0; for(const [c,I,wd] of bands){const d=(w-c)/(wd||20); v+=I*Math.exp(-0.5*d*d);}
    y.push(v);
  }
  return {x,y}; // y in absorbance-ish 0..~1
}
// Mass spectrum sticks: returns sorted peaks with base-peak normalization
function stickSpectrum(peaks){
  const mx=Math.max(...peaks.map(p=>p[1]),1);
  return peaks.map(([mz,i])=>({mz,i:i/mx*100})).sort((a,b)=>a.mz-b.mz);
}
// cosine similarity between two stick spectra (binned at 1 m/z)
function cosine(a,b,tol=0.5){
  let dot=0,na=0,nb=0; const used=new Set();
  for(const pa of a){na+=pa.i*pa.i;}
  for(const pb of b){nb+=pb.i*pb.i;}
  for(const pa of a){let best=null,bd=tol; for(let k=0;k<b.length;k++){if(used.has(k))continue;const d=Math.abs(pa.mz-b[k].mz); if(d<=bd){bd=d;best=k;}} if(best!=null){dot+=pa.i*b[best].i;used.add(best);}}
  return dot/(Math.sqrt(na)*Math.sqrt(nb)||1);
}

/* ---- tooltip ---- */
let _tt;
function tooltip(){
  if(_tt) return _tt;
  _tt=document.createElement('div');
  _tt.style.cssText=`position:fixed;pointer-events:none;z-index:99;background:${TOKENS.panel2};border:1px solid ${TOKENS.line};border-radius:8px;padding:8px 10px;font:12px/1.4 Inter,system-ui;color:${TOKENS.ink};box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;max-width:260px`;
  document.body.appendChild(_tt);
  return {
    show(html,x,y){_tt.innerHTML=html;_tt.style.opacity=1;const r=_tt.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth)nx=x-r.width-14;if(ny+r.height>innerHeight)ny=y-r.height-14;_tt.style.left=nx+'px';_tt.style.top=ny+'px';},
    hide(){_tt.style.opacity=0;}
  };
}

/* ---- page scaffold + global CSS ---- */
function scaffold({tag,title,dek,how,provenance,harm}={}){
  injectCSS();
  document.body.innerHTML=`
    <header class="dcf-h">
      <div class="dcf-tag">${tag||''}</div>
      <h1>${title||''}</h1>
      <p class="dek">${dek||''}</p>
    </header>
    <main id="stage"></main>
    <details class="dcf-how"><summary>How to read this</summary><div>${how||''}</div></details>
    <footer class="dcf-f">
      <p class="prov">${provenance||''}</p>
      ${harm?`<p class="harm">${harm}</p>`:''}
    </footer>`;
  return document.getElementById('stage');
}
function injectCSS(){
  if(document.getElementById('dcf-css')) return;
  const s=document.createElement('style'); s.id='dcf-css';
  s.textContent=`
  :root{--bg:${TOKENS.bg};--panel:${TOKENS.panel};--panel2:${TOKENS.panel2};--line:${TOKENS.line};--ink:${TOKENS.ink};--muted:${TOKENS.muted};--faint:${TOKENS.faint}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",monospace}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .dcf-h{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .dcf-tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .dcf-h h1{font-size:27px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .dek{font-size:15px;line-height:1.5;color:var(--muted);margin:0;max-width:74ch}
  #stage{margin:18px 0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .dcf-how{margin:22px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .dcf-how summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink);list-style:none}
  .dcf-how summary::before{content:"ⓘ ";color:var(--muted)}
  .dcf-how[open] summary{border-bottom:1px solid var(--line)}
  .dcf-how>div{padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .dcf-how b{color:var(--ink)}
  .dcf-f{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}
  .dcf-f .prov{color:var(--faint);margin:0 0 6px}
  .dcf-f .harm{color:var(--muted);margin:0;padding-left:11px;border-left:3px solid ${TOKENS.ok}}
  button.tgl{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:500 13px Inter;cursor:pointer;transition:.15s}
  button.tgl:hover{background:var(--panel2);color:var(--ink)}
  button.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=range]{accent-color:${TOKENS.info}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  `;
  document.head.appendChild(s);
}

/* draw a 2D structure from SMILES into a <canvas id=...>; needs SmilesDrawer loaded.
   Uses the dark theme tuned to the framework background. No-ops gracefully if absent. */
function drawSmiles(smiles,canvasId,w=160,h=120){
  const el=document.getElementById(canvasId);
  if(!el||typeof SmilesDrawer==='undefined'||!smiles){ if(el){const c=el.getContext&&el.getContext('2d');if(c){c.fillStyle='#5b6478';c.font='11px Inter';c.fillText('structure n/a',8,h/2);}} return; }
  try{
    const drawer=new SmilesDrawer.Drawer({width:w,height:h,padding:14,bondThickness:1.1,
      themes:{dcf:{C:'#cfd6e4',N:'#7aa2ff',O:'#ff8a5c',F:'#6ee7a8',S:'#ffd166',Cl:'#6ee7a8',Br:'#ff8a5c',
        BACKGROUND:'#0e1320',bond:'#9aa6bd',default:'#cfd6e4'}}});
    SmilesDrawer.parse(smiles,t=>drawer.draw(t,canvasId,'dcf',false),()=>{});
  }catch(e){}
}


window.DCF={TOKENS,classify,fmt,chromatogram,ftirCurve,stickSpectrum,cosine,tooltip,scaffold,injectCSS,drawSmiles};

})();
</script>
<script>
/* Nº 26 · Reagent Color Matrix — colorimetric spot tests (Marquis, Mandelin,
   Mecke, Froehde, Simon's, Robadope) applied to the most common street drugs.
   Each cell shows the expected reaction color. A field-portable reality check
   for what your eyes might see — with important limits. */
const {scaffold,classify,tooltip,TOKENS}=DCF;

const stage=scaffold({
  tag:'Nº 26 · EXPERIMENTAL',
  title:'Reagent Color Matrix',
  dek:'Colorimetric spot tests react with different drug families by turning distinct colors. This matrix maps expected results — what you\'d expect to see when you add a drop of reagent to a tiny sample.',
  how:`Each <b>cell</b> shows the color a drop of reagent is expected to produce when mixed with a tiny amount of that substance. <b>Rows</b> = reagents; <b>columns</b> = substances. Color accuracy is approximate (display gamut ≠ chemistry). <b>Critical limits:</b> (1) mixtures produce overlapping reactions — a fentanyl-laced stimulant may still turn orange; (2) fentanyl/analogs are often undetectable by standard reagents; (3) xylazine does not produce a reliable reaction in most field tests; (4) reagents confirm <i>class presence</i>, not identity or quantity. Use these results alongside GC-MS, FTIR, or immunoassay strips.`,
  provenance:'Expected reaction colors from published colorimetric chemistry literature and harm-reduction field guides.',
  harm:'Reagents cannot rule out fentanyl or xylazine. A "cocaine" result may still contain fentanyl analogs that don\'t react. Always use fentanyl test strips alongside reagent tests.'
});

// Reagents × substances matrix
const REAGENTS = [
  {name:'Marquis',desc:'H₂SO₄ + formaldehyde'},
  {name:'Mandelin',desc:'H₂SO₄ + ammonium metavanadate'},
  {name:'Mecke',desc:'H₂SO₄ + selenous acid'},
  {name:'Froehde',desc:'H₂SO₄ + molybdate'},
  {name:'Simon\'s',desc:'Na₂CO₃ + nitroprusside + acetic acid'},
  {name:'Robadope',desc:'o-phthalaldehyde, primary amines'},
  {name:'Ehrlich',desc:'DMAB, indoles & LSD'},
];

const SUBSTANCES = [
  {s:'MDMA',cls:'stim'},
  {s:'amphetamine',cls:'stim'},
  {s:'methamphetamine',cls:'stim'},
  {s:'cocaine',cls:'coke'},
  {s:'fentanyl',cls:'fent'},
  {s:'heroin',cls:'opioid'},
  {s:'ketamine',cls:'other'},
  {s:'xylazine',cls:'xyl'},
  {s:'caffeine',cls:'cut'},
  {s:'LSD',cls:'other'},
];

// [color, tooltip note] — hex colors approximating reaction colors
const MATRIX = {
  'Marquis': {
    'MDMA':['#7c3aed','purple → black (typical)'],
    'amphetamine':['#c2410c','orange → brown'],
    'methamphetamine':['#b45309','orange-brown'],
    'cocaine':['#3d3f3d','no reaction / slight yellow'],
    'fentanyl':['#4a4a3d','no color reaction'],
    'heroin':['#8b1a1a','purple → dark red'],
    'ketamine':['#6b6650','no/slight reaction'],
    'xylazine':['#3d3d3a','no reliable reaction'],
    'caffeine':['#b59a2e','dull yellow-orange'],
    'LSD':['#3d3d3a','none'],
  },
  'Mandelin': {
    'MDMA':['#1a1a18','black'],
    'amphetamine':['#b45309','orange'],
    'methamphetamine':['#c2410c','orange → brown'],
    'cocaine':['#6d5b1e','light yellow-brown'],
    'fentanyl':['#3d4040','no reliable color'],
    'heroin':['#064e3b','dark green'],
    'ketamine':['#b45309','orange'],
    'xylazine':['#3d3d3a','no reliable reaction'],
    'caffeine':['#3a3a38','no reaction'],
    'LSD':['#3d3d3a','none'],
  },
  'Mecke': {
    'MDMA':['#1e3a5f','blue-black'],
    'amphetamine':['#334155','blue-green → black'],
    'methamphetamine':['#334155','dark blue-green'],
    'cocaine':['#1a1a18','no reaction / very slight'],
    'fentanyl':['#475569','no reaction'],
    'heroin':['#166534','dark green'],
    'ketamine':['#1d4ed8','blue → yellow'],
    'xylazine':['#3d3d3a','no reliable reaction'],
    'caffeine':['#3a3a38','no reaction'],
    'LSD':['#1e3a5f','blue'],
  },
  'Froehde': {
    'MDMA':['#94a3b8','grey'],
    'amphetamine':['#b45309','faint orange'],
    'methamphetamine':['#b45309','orange-brown'],
    'cocaine':['#1d4ed8','blue (if pure)'],
    'fentanyl':['#475569','no reaction'],
    'heroin':['#166534','green → yellow'],
    'ketamine':['#c2410c','orange-red'],
    'xylazine':['#3d3d3a','no reliable reaction'],
    'caffeine':['#3a3a38','no reaction'],
    'LSD':['#94a3b8','yellow-grey'],
  },
  'Simon\'s': {
    'MDMA':['#1d4ed8','blue (positive for secondary amines)'],
    'amphetamine':['#3d3d3a','no reaction (primary amine)'],
    'methamphetamine':['#1d4ed8','blue (secondary amine)'],
    'cocaine':['#3d3d3a','no reaction'],
    'fentanyl':['#3d3d3a','no reaction'],
    'heroin':['#3d3d3a','no reaction'],
    'ketamine':['#3d3d3a','no reliable color'],
    'xylazine':['#3d3d3a','no reliable reaction'],
    'caffeine':['#3d3d3a','no reaction'],
    'LSD':['#3d3d3a','no reaction'],
  },
  'Robadope': {
    'MDMA':['#3d3d3a','no reaction (secondary amine)'],
    'amphetamine':['#c2410c','orange (primary amine)'],
    'methamphetamine':['#3d3d3a','no reaction'],
    'cocaine':['#3d3d3a','no reaction'],
    'fentanyl':['#3d3d3a','no reaction'],
    'heroin':['#3d3d3a','slight'],
    'ketamine':['#3d3d3a','no reliable reaction'],
    'xylazine':['#3d3d3a','no reliable reaction'],
    'caffeine':['#3d3d3a','no reaction'],
    'LSD':['#3d3d3a','no reaction'],
  },
  'Ehrlich': {
    'MDMA':['#7c3aed','purple (contains indole analog)'],
    'amphetamine':['#3d3d3a','no reaction'],
    'methamphetamine':['#3d3d3a','no reaction'],
    'cocaine':['#3d3d3a','no reaction'],
    'fentanyl':['#3d3d3a','no reaction'],
    'heroin':['#3d3d3a','no reaction'],
    'ketamine':['#3d3d3a','no reaction'],
    'xylazine':['#3d3d3a','no reaction'],
    'caffeine':['#3d3d3a','no reaction'],
    'LSD':['#7c3aed','strong purple'],
  },
};

stage.innerHTML=`<div class="panel" style="overflow-x:auto"><svg id="svg" role="img" aria-label="Reagent color reaction matrix"></svg></div>
<div style="margin-top:12px;font-size:12px;color:${TOKENS.muted};line-height:1.6">
  <b>Limits:</b> Colors are approximate display representations. Field reactions vary with purity, matrix, and lighting.
  Fentanyl and xylazine are not reliably detected by any of these reagents. Always combine with strip tests.
</div>`;
const tt=tooltip();

function draw(){
  const cw=90,ch=44,rw=140,rh=26,pad=6;
  const W=rw+SUBSTANCES.length*(cw+pad)+40;
  const H=rh+REAGENTS.length*(ch+pad)+50;
  const svg=d3.select('#svg').attr('width',W).attr('height',H);
  svg.selectAll('*').remove();

  // Column headers (substances)
  SUBSTANCES.forEach((sub,ci)=>{
    const x=rw+(ci*(cw+pad))+cw/2;
    const col=classify(sub.s).color;
    svg.append('rect').attr('x',rw+ci*(cw+pad)).attr('y',0).attr('width',cw).attr('height',rh-4).attr('rx',4).attr('fill',col).attr('opacity',.18);
    svg.append('text').attr('x',x).attr('y',rh/2+2).attr('text-anchor','middle').attr('fill',col).attr('font-size',11).attr('font-weight',600).text(sub.s);
  });

  // Row headers + cells
  REAGENTS.forEach((rg,ri)=>{
    const y=rh+ri*(ch+pad);
    // Row label
    svg.append('text').attr('x',rw-10).attr('y',y+ch/2+4).attr('text-anchor','end').attr('fill',TOKENS.ink).attr('font-size',12).attr('font-weight',600).text(rg.name);
    svg.append('text').attr('x',rw-10).attr('y',y+ch/2+16).attr('text-anchor','end').attr('fill',TOKENS.faint).attr('font-size',9).text(rg.desc);
    // Cells
    SUBSTANCES.forEach((sub,ci)=>{
      const cx=rw+ci*(cw+pad), cy=y;
      const cell=(MATRIX[rg.name]||{})[sub.s]||['#2d2d2d','unknown'];
      const [bg,note]=cell;
      const isDark=['#3d3d3a','#3a3a38','#4a4a3d','#3d4040','#475569','#334155'].includes(bg);
      svg.append('rect').attr('x',cx).attr('y',cy).attr('width',cw).attr('height',ch).attr('rx',5)
        .attr('fill',bg).attr('stroke',TOKENS.line).attr('stroke-width',1)
        .style('cursor','pointer')
        .on('mousemove',e=>tt.show(`<b>${rg.name} + ${sub.s}</b><br><span class="muted">${note}</span>`,e.clientX,e.clientY))
        .on('mouseleave',tt.hide);
      // label the color name
      const label=isDark?'—':note.split(' ')[0];
      svg.append('text').attr('x',cx+cw/2).attr('y',cy+ch/2+4).attr('text-anchor','middle').attr('font-size',9).attr('fill',isDark?TOKENS.faint:'#fff').attr('font-weight',isDark?400:600).text(label);
    });
  });

  // Legend note at bottom
  svg.append('text').attr('x',rw).attr('y',H-10).attr('fill',TOKENS.muted).attr('font-size',10).text('Hover cells for expected color description · Colors are approximations only');
}
draw();
addEventListener('resize',draw);

</script>
